<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bench Manager">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0B69C7">
<title>Hockey Bench Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v5.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16-v5.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v5.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64-v5.png">
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:#EFEFF4;
  --sep:rgba(60,60,67,.20);
  --text:#0A0A0A; --text2:rgba(60,60,67,.62); --text3:rgba(60,60,67,.38);
  --tint:#0B69C7; --tint-soft:rgba(11,105,199,.12);
  --bench:#B25E00; --bench-soft:rgba(178,94,0,.12);
  --danger:#C8102E; --danger-soft:rgba(200,16,46,.12);
  --cg:#1E9E4A; --cg-soft:rgba(30,158,74,.16);
  --cy:#C79100; --cy-soft:rgba(199,145,0,.18);
  --cr:#C8102E; --cr-soft:rgba(200,16,46,.14);
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E;
    --sep:rgba(84,84,88,.65);
    --text:#FFFFFF; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.32);
    --tint:#4DA6FF; --tint-soft:rgba(77,166,255,.18);
    --bench:#FFA53D; --bench-soft:rgba(255,165,61,.18);
    --danger:#FF5A5F; --danger-soft:rgba(255,90,95,.18);
    --cg:#3ED16A; --cg-soft:rgba(62,209,106,.2);
    --cy:#FFD60A; --cy-soft:rgba(255,214,10,.2);
    --cr:#FF5A5F; --cr-soft:rgba(255,90,95,.2);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}

.nav{flex:0 0 auto;position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);padding-top:env(safe-area-inset-top,0px)}
.nav-row{display:flex;align-items:center;gap:6px;height:52px;padding:0 6px}
.nav-btn{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tint);border-radius:10px}
.nav-btn:active{background:var(--fill)}
.nav-btn.txt{padding:0 10px;font-size:17px}
.nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.nav-title{display:block;min-width:0;padding:2px 4px;border-radius:9px}
button.nav-title:active{background:var(--fill)}
.nav-sub{display:block;font-size:12px;font-weight:400;color:var(--text2);letter-spacing:0}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:26px}
main.no-scroll{overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}

h1.large{font-size:32px;font-weight:700;letter-spacing:-.024em;margin:8px 16px 14px}
.sec{margin:22px 0 7px;padding:0 16px;font-size:13px;color:var(--text2)}
.card{background:var(--surface);border-radius:var(--r);margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 16px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--text2);margin-top:2px}
.row .v{color:var(--text2);font-size:15px}
.chev{color:var(--text3);flex:0 0 auto}
button.row:active{background:var(--fill)}
.row input[type=text],.row input[type=date],.row input[type=tel]{flex:1;min-width:0;border:0;background:transparent;outline:none;text-align:right;font-size:17px}
.row label.lbl{flex:0 0 auto;font-size:17px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:var(--r);
  background:var(--tint);color:#fff;font-size:17px;font-weight:600;width:100%}
.btn:active{opacity:.82}
.btn[disabled]{opacity:.38}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.dngr{background:var(--danger)}
.pad{padding:16px}
.muted{color:var(--text2);font-size:14px;padding:0 16px;margin:8px 0}
.empty{text-align:center;color:var(--text2);padding:52px 28px;font-size:15px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.stepper{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:9px;padding:2px}
.stepper button{width:40px;height:32px;border-radius:7px;font-size:19px;color:var(--tint)}
.stepper span{min-width:44px;text-align:center;font-size:16px}

/* wedstrijdscherm */
.score{flex:0 0 auto;background:var(--surface);border-bottom:.5px solid var(--sep);padding:10px 12px 12px}
.score-top{display:flex;align-items:flex-start;justify-content:center;gap:10px;width:100%}
.score-side{flex:1 1 0;min-width:0;text-align:center}
.score-side .nm{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-side .pt{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.score-mid{flex:0 0 auto;text-align:center}
.clock{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1}
.clock.over{color:var(--danger)}
.clock.idle{color:var(--text3)}
.clock-sub{font-size:11.5px;color:var(--text2);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--text2);margin-top:6px}
.pill.live{background:var(--tint-soft);color:var(--tint)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tint)}
.pill.paused{background:var(--bench-soft);color:var(--bench)}

.sheet-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pl{position:relative;background:var(--surface);border-radius:12px;padding:8px 26px 8px 9px;display:flex;gap:8px;
  align-items:flex-start;text-align:left;width:100%;border:1.5px solid transparent;min-height:58px}
.pl:active{transform:scale(.985)}
.badge-wrap{position:relative;flex:0 0 32px}
.pl .n{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;background:var(--fill);color:var(--text)}
.goalbub{position:absolute;top:-5px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;
  background:var(--cg);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--surface)}
.goalbub[hidden]{display:none}
.subcount{position:absolute;right:6px;bottom:5px;font-size:11px;font-weight:600;color:var(--text3);
  min-width:16px;height:16px;border-radius:99px;background:var(--fill);display:flex;align-items:center;justify-content:center}
.pl.field{border-color:var(--tint-soft)} .pl.field .n{background:var(--tint);color:#fff}
.pl.bench .n{background:var(--bench-soft);color:var(--bench)}
.pl.susp.c-groen{border-color:var(--cg)} .pl.susp.c-groen .n{background:var(--cg);color:#fff}
.pl.susp.c-geel{border-color:var(--cy)}  .pl.susp.c-geel .n{background:var(--cy);color:#000}
.pl.out{opacity:.45} .pl.out .n{background:var(--cr);color:#fff}
.pl .info{min-width:0;flex:1}
.pl .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .tm{font-size:11.5px;color:var(--text2);margin-top:2px;display:flex;gap:8px}
.pl .tm b{font-weight:600;color:var(--tint)}
.pl .tm .bb{color:var(--bench);font-weight:600}
.pl .now{font-size:11px;margin-top:2px;color:var(--bench);font-weight:700}
.pl .now.sus{color:var(--danger)}

.strip{flex:0 0 auto;padding:6px 10px;border-top:.5px solid var(--sep);background:var(--bg)}
.strip h6{margin:0 0 5px 2px;font-size:11px;font-weight:600;color:var(--text2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:11px;padding:6px 10px;min-height:40px;border:1.5px solid transparent}
.chip b{font-size:15px;font-weight:700}
.chip .tt{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.chip.bench b{color:var(--bench)}
.chip.sus.c-groen{background:var(--cg-soft);border-color:var(--cg)}
.chip.sus.c-groen b,.chip.sus.c-groen .tt{color:var(--cg);font-weight:700}
.chip.sus.c-geel{background:var(--cy-soft);border-color:var(--cy)}
.chip.sus.c-geel b,.chip.sus.c-geel .tt{color:var(--cy);font-weight:700}
.chip.bench.next{border-color:var(--bench);background:var(--bench-soft)}
.pl.field.ready{border-color:var(--tint);animation:puls 1.1s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pl.field.ready{animation:none}}
.chip-empty{font-size:12.5px;color:var(--text3);padding:10px 2px}

.dock{flex:0 0 auto;background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.act{flex:1;height:52px;border-radius:13px;background:var(--fill);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600}
.act svg{width:20px;height:20px}
.act:active{opacity:.7}
.act.primary{background:var(--tint);color:#fff;flex:1.25}
.act.stop{background:var(--bench);color:#fff}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:16px 16px 0 0;
  max-height:88%;display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.modal.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.modal,.scrim{transition:none}}
.modal .hdl{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:8px auto 2px;flex:0 0 auto}
.modal .mh{display:flex;align-items:center;padding:8px 8px 6px;flex:0 0 auto}
.modal .mh .ttl{flex:1;text-align:center;font-size:17px;font-weight:600}
.modal .mb{overflow-y:auto;padding-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;background:var(--surface)}
.opt + .opt{border-top:.5px solid var(--sep)}
.opt:active{background:var(--fill)}
.opt .badge{flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:var(--fill)}
.opt .badge.f{background:var(--tint);color:#fff}
.opt .badge.b{background:var(--bench-soft);color:var(--bench)}
.dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.dot.groen{background:var(--cg)} .dot.geel{background:var(--cy)} .dot.rood{background:var(--cr)}
.ta{width:100%;height:190px;font-size:12px;border-radius:12px;border:1px solid var(--sep);background:var(--surface);color:var(--text);padding:10px}
.updbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--tint);color:#fff;font-size:14px;font-weight:600}
.updbar button{margin-left:auto;background:rgba(255,255,255,.22);color:#fff;font-size:13px;
  font-weight:700;padding:7px 13px;border-radius:9px}
.updbar .x{background:none;margin-left:0;padding:7px 4px;opacity:.8;font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);
  background:rgba(28,28,30,.96);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:80;
  opacity:0;transition:.2s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th{font-size:11.5px;color:var(--text2);font-weight:500;text-align:right;padding:8px;border-bottom:.5px solid var(--sep)}
table.st th:first-child,table.st td:first-child{text-align:left;padding-left:14px}
table.st td{padding:9px 8px;text-align:right;border-bottom:.5px solid var(--sep)}
table.st tr:last-child td{border-bottom:0}
.logline{display:flex;gap:10px;padding:9px 16px;font-size:14px;align-items:baseline}
.logline + .logline{border-top:.5px solid var(--sep)}
.logline .lt{flex:0 0 58px;color:var(--text2);font-size:12.5px}
.ver{text-align:center;color:var(--text3);font-size:12px;padding:18px 0 6px}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px;border-radius:8px}
/* 3.0: aanmelden, laden, profiel, synchronisatie */
.gate{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px));text-align:center}
.gate img{width:88px;height:88px;border-radius:20px;background:#fff;box-shadow:0 1px 0 var(--sep),0 6px 18px rgba(11,105,199,.14)}
.gate h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:18px 0 6px}
.gate p{color:var(--text2);font-size:15px;margin:0 0 6px;max-width:340px}
.gate .btn{max-width:340px;margin-top:22px}
.gate .link{color:var(--tint);font-size:15px;margin-top:16px;padding:8px}
.gate .err{color:var(--danger);font-size:14px;margin-top:14px;max-width:340px}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--tint-soft);border-top-color:var(--tint);
  animation:spin .8s linear infinite;margin-top:22px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.nav-btn.pending{position:relative}
.nav-btn.pending::after{content:"";position:absolute;top:9px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--bench);box-shadow:0 0 0 2px var(--bg)}
.syncdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--cg)}
.syncdot.wait{background:var(--bench)}
.syncdot.off{background:var(--text3)}
.viewbar{flex:1;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 4px}
.viewbar .eye{color:var(--tint);display:flex}
.viewbar .grow{flex:1;min-width:0}
.viewbar .t{font-size:15px;font-weight:600}
.viewbar .s{font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.takebtn{height:44px;padding:0 16px;border-radius:12px;background:var(--tint);color:#fff;font-weight:600;font-size:15px}
.syncdot.fail{background:var(--danger)}
.nav-btn.failed{position:relative}
.nav-btn.failed::after{content:"";position:absolute;top:9px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);box-shadow:0 0 0 2px var(--bg)}
.logline .by{margin-left:auto;padding-left:8px;color:var(--text3);font-size:12px;white-space:nowrap}
.row select{flex:1;min-width:0;border:0;background:transparent;outline:none;text-align:right;text-align-last:right;font-size:17px;color:var(--text);-webkit-appearance:none;appearance:none}
</style>
</head>
<body>
<div id="app">
  <header class="nav"><div class="nav-row" id="nav"></div></header>
  <main id="view"></main>
  <footer id="dock" hidden></footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===========================================================
   Hockey Bench Manager — speeltijd en banktijd bij hockey
   Gemaakt voor Anneliese van KHC Dragons
   =========================================================== */
const APP_VERSION = "3.3.0";
const APP_NAME = "Hockey Bench Manager";
const CONTACT_MAIL = "bvherck79@gmail.com";
const DATA_VERSION = 2;

/* In het geheugen heten teams nog 'seasons' (zoals in 2.x), zodat de rest van de app
   ongewijzigd kan blijven. Eén 'season' = één team in één seizoen:
   { id, clubId, club (reservenaam), team, name (= seizoen, bv. "2026–2027"), roster, matches,
     members, admins, people {uid:{f,l}}, invite {code,until}, createdBy, created } */
let S = { v:DATA_VERSION, seasons:[], activeSeason:null, openMatch:null, lastBackup:null };
let USER = null;          /* aangemelde gebruiker (Firebase) */
let PROFILE;              /* undefined = nog onbekend, null = nog geen profiel, object = { first, last, email } */
let READY = false;        /* gegevens geladen en eerste scherm gekozen */
let BOOT_ERR = "";

/* ---------- back-ups uit oudere versies omzetten ---------- */
function migrateData(p){
  p.seasons = Array.isArray(p.seasons) ? p.seasons : [];
  p.seasons.forEach(se=>{
    const r = {};
    Object.keys(se.roster||{}).forEach(n=>{
      const val = se.roster[n];
      r[n] = (typeof val === "string") ? { f:val, l:"" } : (val || { f:"", l:"" });
    });
    se.roster = r;
    se.matches = Array.isArray(se.matches) ? se.matches : [];
    se.matches.forEach(m=>{
      Object.values(m.players||{}).forEach(p=>{
        if(p.name !== undefined){ p.f = p.name; p.l = ""; delete p.name; }
        if(p.f === undefined) p.f = "";
        if(p.l === undefined) p.l = "";
        if(p.goals === undefined) p.goals = 0;
      });
    });
  });
  p.v = DATA_VERSION;
  return p;
}

/* ---------- toestelinstellingen (enkel op dit toestel) ---------- */
function uiKey(){ return USER ? "hbm.ui." + USER.uid : null; }
function uiLoad(){
  try{ const k = uiKey(); const p = k && JSON.parse(localStorage.getItem(k) || "null"); return p || {}; }
  catch(e){ return {}; }
}
function uiSave(){
  try{
    const k = uiKey(); if(!k) return;
    localStorage.setItem(k, JSON.stringify({ activeSeason:S.activeSeason, openMatch:S.openMatch, lastBackup:S.lastBackup }));
  }catch(e){}
}

/* ---------- bewaren: alles gaat naar Firestore ---------- */
function save(now){
  uiSave();
  if(now){ flush(); return; }
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flush, 400);
}
window.addEventListener("pagehide", ()=> flush());
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flush(); });

/* ---------- synchronisatie ----------
   lastSent[pad] = laatst gekende inhoud op de server (als vaste tekst).
   Is de inhoud in de app anders, dan wordt ze geschreven. Komt er van de server iets nieuws
   binnen en heeft dit toestel geen onbewaarde wijziging aan dat document, dan wordt het overgenomen.
   Paden: "t/<teamId>" en "m/<teamId>/<matchId>". */
const SYNC = { lastSent:{}, seenTs:{}, unsubTeams:null, unsubUser:null, unsubClubs:null, unsubMatches:{}, loadedMatches:{},
  gotTeams:false, gotClubs:false, pending:0, timer:null, errShown:false, full:true, fullAt:0, failed:0, lastErr:"", okAt:0 };
let CLUBS = {};              /* id -> { id, name, norm } */
let JOIN_PENDING = null;     /* team waar je net lid van werd, openen zodra het binnen is */

function stable(v){
  if(v === undefined || (typeof v === "number" && !isFinite(v))) return "null";
  if(v === null || typeof v !== "object") return JSON.stringify(v);
  if(Array.isArray(v)) return "[" + Array.from(v, x=> stable(x)).join(",") + "]";
  return "{" + Object.keys(v).filter(k=> v[k] !== undefined).sort().map(k=> JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";
}
const plain = o => JSON.parse(JSON.stringify(o));
function teamContent(se){
  return { id:se.id, clubId:se.clubId||"", club:se.club||"", team:se.team||"", season:se.name||"", roster:se.roster||{},
    members:se.members||[], admins:se.admins||[], people:se.people||{}, invites:se.invites||[], prevTeam:se.prevTeam||"",
    createdBy:se.createdBy||"", created:se.created||0 };
}
function applyTeam(se, c){
  se.clubId = c.clubId||""; se.club = c.club||""; se.team = c.team||""; se.name = c.season||""; se.roster = c.roster||{};
  se.members = c.members||[]; se.admins = c.admins||[]; se.people = c.people||{};
  se.invites = Array.isArray(c.invites) ? c.invites : (c.invite && c.invite.code ? [c.invite] : []);
  se.createdBy = c.createdBy||""; se.created = c.created||0; se.prevTeam = c.prevTeam||"";
  if(!Array.isArray(se.matches)) se.matches = [];
}
/* openbaar teamoverzicht: enkel wat nodig is om een bestaand team te herkennen */
function dirContent(se){
  const ppl = se.people || {};
  return { teamId:se.id, clubId:se.clubId||"", club:clubName(se), team:se.team||"", norm:normName(se.team),
    season:se.name||"", admins:(se.admins||[]).map(u=> shortOf(ppl[u])).filter(Boolean) };
}
function stripMeta(d){ const o = Object.assign({}, d); delete o.updatedAt; delete o.updatedBy; delete o.joinCode; return o; }
function tsOf(x){ try{ return x && x.toMillis ? x.toMillis() : 0; }catch(e){ return 0; } }

function flush(){
  clearTimeout(SYNC.timer); SYNC.timer = null;
  if(!USER || !window.FB || !SYNC.gotTeams) return;
  const F = window.FB;
  /* snel: enkel de open wedstrijd en nieuwe wedstrijden vergelijken; af en toe alles */
  const full = SYNC.full || Date.now() - SYNC.fullAt > 30000;
  if(full){ SYNC.full = false; SYNC.fullAt = Date.now(); }
  const teamSets = [], matchOps = [], teamDels = [], present = new Set();
  S.seasons.forEach(se=>{
    const tp = "t/" + se.id; present.add(tp);
    const tc = teamContent(se), tj = stable(tc);
    if(SYNC.lastSent[tp] !== tj){ teamSets.push(["set", F.doc(F.db, "teams", se.id), plain(tc), tp]); SYNC.lastSent[tp] = tj; }
    const dp = "d/" + se.id; present.add(dp);
    const dc = dirContent(se), dj = stable(dc);
    if(SYNC.lastSent[dp] !== dj){ matchOps.push(["set", F.doc(F.db, "directory", se.id), plain(dc), dp]); SYNC.lastSent[dp] = dj; }
    (se.matches||[]).forEach(m=>{
      const mp = "m/" + se.id + "/" + m.id; present.add(mp);
      if(!full && SYNC.lastSent[mp] !== undefined && m.id !== S.openMatch) return;
      const mj = stable(m);
      if(SYNC.lastSent[mp] !== mj){ matchOps.push(["set", F.doc(F.db, "teams", se.id, "matches", m.id), plain(m), mp]); SYNC.lastSent[mp] = mj; }
    });
  });
  Object.keys(SYNC.lastSent).forEach(p=>{
    if(present.has(p)) return;
    const q = p.split("/");
    if(q[0] === "m") matchOps.push(["del", F.doc(F.db, "teams", q[1], "matches", q[2])]);
    else if(q[0] === "d") matchOps.push(["del", F.doc(F.db, "directory", q[1])]);
    else teamDels.push(["del", F.doc(F.db, "teams", q[1])]);
    delete SYNC.lastSent[p]; delete SYNC.seenTs[p];
  });
  /* volgorde telt: eerst teams (anders mogen wedstrijden en het teamoverzicht er nog niet in),
     dan wedstrijden en teamoverzicht, en pas als laatste gewiste teams */
  commitOps(teamSets); commitOps(matchOps); commitOps(teamDels);
}
function commitOps(ops){
  const F = window.FB;
  for(let i = 0; i < ops.length; i += 400){
    const b = F.writeBatch(F.db);
    ops.slice(i, i + 400).forEach(o=>{
      if(o[0] === "set") b.set(o[1], Object.assign(o[2], { updatedAt:F.serverTimestamp(), updatedBy:USER.uid }));
      else b.delete(o[1]);
    });
    const keys = ops.slice(i, i + 400).map(o=> o[3]).filter(Boolean);
    SYNC.pending++; paintSync();
    b.commit().then(()=>{ SYNC.okAt = Date.now(); }, e=>{
      if(e && e.code === "permission-denied" && keys.length && keys.every(k=> k.indexOf("m/") === 0)){ keys.forEach(resyncMatch); return; }
      /* niet bewaard: bij de volgende ronde opnieuw proberen */
      keys.forEach(k=> delete SYNC.lastSent[k]); SYNC.full = true;
      SYNC.failed++; SYNC.lastErr = (e && e.code) || "fout";
      syncError(e);
    }).finally(()=>{ SYNC.pending--; paintSync(); });
  }
}
/* losse schrijfactie (clubs, codes, lid worden): geeft true of false terug */
function trackCommit(b, quiet){
  SYNC.pending++; paintSync();
  return b.commit().then(()=> true, e=>{ console.warn(e); if(!quiet) syncError(e); return false; })
    .finally(()=>{ SYNC.pending--; paintSync(); });
}
/* een wedstrijd waarvan de schrijfactie geweigerd werd (bv. overgenomen): de cloud heeft gelijk */
async function resyncMatch(k){
  const q = k.split("/"), F = window.FB;
  const fail = code=>{ delete SYNC.lastSent[k]; SYNC.full = true; SYNC.failed++; SYNC.lastErr = code; paintSync(); };
  try{
    const d = await F.getDoc(F.doc(F.db, "teams", q[1], "matches", q[2]));
    const se = S.seasons.find(x=> x.id === q[1]); if(!se) return;
    const i = se.matches.findIndex(x=> x.id === q[2]);
    const cur = i >= 0 ? se.matches[i] : null;
    const c = d.exists() ? Object.assign(stripMeta(d.data()), { id:q[2] }) : null;
    const lc = (cur && cur.ctrl) || {}, rc = (c && c.ctrl) || {};
    if(c && cur && stable(cur) === stable(c)){ SYNC.lastSent[k] = stable(c); return; }   /* al bijgewerkt */
    if(c && rc.dev && (rc.dev !== DEV || rc.dev !== lc.dev || rc.n !== lc.n)){
      /* overgenomen door een ander toestel: de cloud heeft gelijk */
      if(i >= 0) se.matches[i] = c; else se.matches.push(c);
      SYNC.lastSent[k] = stable(c); remoteChanged();
      if(lc.dev === DEV) toast((rc.name || "Een ander toestel") + " bedient deze wedstrijd. Je kijkt nu mee.", 4500);
      return;
    }
    fail("permission-denied");
  }catch(e){ fail((e && e.code) || "fout"); }
}
function syncError(e){
  console.warn("bewaren mislukt", e);
  if(Date.now() - (SYNC.errAt||0) < 15000) return;
  SYNC.errAt = Date.now();
  toast(e && e.code === "permission-denied"
    ? "Bewaren geweigerd door de databank. Kijk de regels in Firebase na."
    : "Bewaren in de cloud mislukt", 5000);
}

function startSync(){
  const F = window.FB, uidNow = USER.uid;
  SYNC.unsubUser = F.onSnapshot(F.doc(F.db, "users", uidNow), snap=>{
    if(!USER || USER.uid !== uidNow) return;
    if(snap.exists()){ PROFILE = snap.data(); }
    else if(!snap.metadata.fromCache){ PROFILE = null; }
    else return;
    maybeRoute();
  }, e=> bootError(e));
  SYNC.unsubClubs = F.onSnapshot(F.collection(F.db, "clubs"), snap=>{
    if(!USER || USER.uid !== uidNow) return;
    const m = {};
    snap.docs.forEach(d=>{ const x = d.data(); m[d.id] = { id:d.id, name:x.name||"", norm:x.norm||normClub(x.name) }; });
    CLUBS = m; SYNC.gotClubs = true;
    remoteChanged(); maybeRoute();
  }, e=> bootError(e));
  const q = F.query(F.collection(F.db, "teams"), F.where("members", "array-contains", uidNow));
  SYNC.unsubTeams = F.onSnapshot(q, snap=>{ if(USER && USER.uid === uidNow) onTeamsSnap(snap); }, e=> bootError(e));
}
function stopSync(){
  try{ SYNC.unsubUser && SYNC.unsubUser(); }catch(e){}
  try{ SYNC.unsubTeams && SYNC.unsubTeams(); }catch(e){}
  try{ SYNC.unsubClubs && SYNC.unsubClubs(); }catch(e){}
  Object.values(SYNC.unsubMatches).forEach(u=>{ try{ u(); }catch(e){} });
  Object.assign(SYNC, { lastSent:{}, seenTs:{}, unsubTeams:null, unsubUser:null, unsubClubs:null, unsubMatches:{}, loadedMatches:{},
    gotTeams:false, gotClubs:false, errShown:false, full:true, fullAt:0, failed:0, lastErr:"" });
  CLUBS = {}; JOIN_PENDING = null; TRASH_T = {}; TRASH_M = null; purgedOnce = false;
  clearTimeout(SYNC.timer); SYNC.timer = null;
  S = { v:DATA_VERSION, seasons:[], activeSeason:null, openMatch:null, lastBackup:null };
}
function onTeamsSnap(snap){
  const ids = new Set(), trash = {};
  snap.docs.forEach(d=>{
    const dd = d.data();
    if(dd.deleted){
      trash[d.id] = Object.assign({ id:d.id }, dd.deleted);
      const se0 = S.seasons.find(x=> x.id === d.id);
      if(se0){
        if(READY && dd.deleted.by !== USER.uid) toast(teamLabel(se0) + " is naar de prullenbak verplaatst door " + (dd.deleted.byName || "een teamgenoot"), 4500);
        removeTeamLocal(d.id);
      }
      return;
    }
    if(RESTORED[d.id]){ delete RESTORED[d.id]; setTimeout(()=> save(), 500); }
    ids.add(d.id);
    if(d.metadata.hasPendingWrites) return;          /* eigen wijziging die nog onderweg is */
    const p = "t/" + d.id, data = d.data(), ts = tsOf(data.updatedAt);
    let se = S.seasons.find(x=> x.id === d.id);
    if(se && SYNC.seenTs[p] === ts){ ensureMatches(d.id); return; }
    SYNC.seenTs[p] = ts;
    const c = stripMeta(data); c.id = d.id;
    const tmp = { id:d.id }; applyTeam(tmp, c);
    const j = stable(teamContent(tmp));
    if(!se){ se = { id:d.id, matches:[] }; applyTeam(se, c); S.seasons.push(se); remoteChanged(); }
    else if(j !== SYNC.lastSent[p]){
      const localJ = stable(teamContent(se));
      if(SYNC.lastSent[p] === undefined || localJ === SYNC.lastSent[p]){ applyTeam(se, c); remoteChanged(); }
      else{
        /* eigen wijziging onderweg: ledenlijst komt altijd van de server, de rest van dit toestel */
        se.members = c.members||[]; se.admins = c.admins||[]; se.people = c.people||{};
        remoteChanged(); setTimeout(()=> save(), 0);
      }
    }
    SYNC.lastSent[p] = j;
    ensureMatches(d.id);
  });
  S.seasons.slice().forEach(se=>{
    if(!ids.has(se.id) && SYNC.lastSent["t/" + se.id] !== undefined){
      if(READY) toast(teamLabel(se) + " (" + se.name + ") is niet meer beschikbaar", 4000);
      removeTeamLocal(se.id);
    }
  });
  TRASH_T = trash;
  S.seasons.sort((a,b)=> (b.created||0) - (a.created||0));
  SYNC.gotTeams = true;
  maybeRoute();
}
function removeTeamLocal(id){
  S.seasons = S.seasons.filter(x=> x.id !== id);
  Object.keys(SYNC.lastSent).forEach(p=>{ if(p === "t/" + id || p === "d/" + id || p.indexOf("m/" + id + "/") === 0){ delete SYNC.lastSent[p]; delete SYNC.seenTs[p]; } });
  const u = SYNC.unsubMatches[id]; if(u){ try{ u(); }catch(e){} delete SYNC.unsubMatches[id]; }
  if(S.activeSeason === id){ S.activeSeason = S.seasons.length ? S.seasons[0].id : null; S.openMatch = null; uiSave(); }
  remoteChanged();
}
function ensureMatches(teamId){
  if(SYNC.unsubMatches[teamId]) return;
  const F = window.FB;
  SYNC.unsubMatches[teamId] = F.onSnapshot(F.collection(F.db, "teams", teamId, "matches"),
    snap=> onMatchesSnap(teamId, snap),
    e=>{
      console.warn("wedstrijden laden mislukt", teamId, e);
      delete SYNC.unsubMatches[teamId];
      SYNC.loadedMatches[teamId] = true; maybeRoute();
      setTimeout(()=>{ if(USER && S.seasons.some(x=> x.id === teamId)) ensureMatches(teamId); }, 5000);
    });
}
function onMatchesSnap(teamId, snap){
  const se = S.seasons.find(x=> x.id === teamId); if(!se) return;
  const ids = new Set();
  snap.docs.forEach(d=>{
    ids.add(d.id);
    if(d.metadata.hasPendingWrites) return;
    const p = "m/" + teamId + "/" + d.id, data = d.data(), ts = tsOf(data.updatedAt);
    const i = se.matches.findIndex(x=> x.id === d.id);
    if(i >= 0 && SYNC.seenTs[p] === ts) return;
    SYNC.seenTs[p] = ts;
    const c = stripMeta(data); c.id = d.id;
    const j = stable(c);
    if(i < 0){ se.matches.push(c); remoteChanged(); }
    else if(j !== SYNC.lastSent[p]){
      const cur = se.matches[i], localJ = stable(cur);
      const lc = cur.ctrl || {}, rc = c.ctrl || {};
      const takenOver = c.status === "live" && rc.dev && (rc.dev !== lc.dev || rc.n !== lc.n);
      if(SYNC.lastSent[p] === undefined || localJ === SYNC.lastSent[p] || takenOver){
        if(takenOver && lc.dev === DEV && rc.dev !== DEV && READY) toast((rc.name || "Een ander toestel") + " heeft de bediening overgenomen. Je kijkt nu mee.", 4500);
        se.matches[i] = c; remoteChanged();
      }
    }
    SYNC.lastSent[p] = j;
  });
  se.matches.slice().forEach(m=>{
    if(!ids.has(m.id) && SYNC.lastSent["m/" + teamId + "/" + m.id] !== undefined){
      se.matches = se.matches.filter(x=> x.id !== m.id);
      delete SYNC.lastSent["m/" + teamId + "/" + m.id];
      if(S.openMatch === m.id){ S.openMatch = null; uiSave(); }
      remoteChanged();
    }
  });
  se.matches.sort((a,b)=> (b.created||0) - (a.created||0));
  SYNC.loadedMatches[teamId] = true;
  maybeRoute();
  if(READY && JOIN_PENDING === teamId){
    JOIN_PENDING = null; S.activeSeason = teamId; S.openMatch = null; uiSave();
    go("season"); toast("Welkom in " + teamLabel(se));
  }
}
let rrT = null;
function remoteChanged(){
  if(rrT) return;
  rrT = setTimeout(()=>{
    rrT = null;
    if(!READY) return;
    if(VIEW === "setup" || VIEW === "profile") return;
    if(VIEW === "match") renderMatch(); else render();
  }, 80);
}
function maybeRoute(){
  if(READY || !USER) return;
  if(PROFILE === undefined || !SYNC.gotTeams || !SYNC.gotClubs) return;
  if(PROFILE === null){ if(VIEW !== "profile"){ VIEW = "profile"; render(); } return; }
  const ui = uiLoad();
  S.activeSeason = ui.activeSeason || null; S.openMatch = ui.openMatch || null; S.lastBackup = ui.lastBackup || null;
  if(S.activeSeason && !season()) S.activeSeason = null;
  if(!S.activeSeason && S.seasons.length) S.activeSeason = S.seasons[0].id;
  const se = season();
  if(se && !SYNC.loadedMatches[se.id]) return;
  READY = true;
  const cur = match();
  VIEW = (cur && cur.status === "live") ? "match" : (se ? "season" : "home");
  render();
  migrateTeams();
}
/* teams uit 3.0: koppelen aan een club uit de clubdatabank, en je eigen naam bij de leden zetten */
function migrateTeams(){
  let ch = false;
  S.seasons.forEach(se=>{
    if(!se.clubId && (se.club||"").trim()){
      const n = normClub(se.club);
      const hit = Object.values(CLUBS).find(c=> c.norm === n);
      se.clubId = hit ? hit.id : createClub(se.club.trim());
      ch = true;
    }
    if(PROFILE && (!se.people || !se.people[USER.uid])){
      se.people = Object.assign({}, se.people); se.people[USER.uid] = { f:PROFILE.first||"", l:PROFILE.last||"" }; ch = true;
    }
  });
  if(ch){ SYNC.full = true; save(true); }
  handlePendingCode();
  setTimeout(purgeOld, 5000);
}
function syncState(){
  if(SYNC.failed) return "fail";
  if(!navigator.onLine) return SYNC.pending ? "wait" : "off";
  return SYNC.pending ? "busy" : "ok";
}
function paintSync(){
  const st = syncState();
  document.querySelectorAll('.nav-btn[aria-label="Menu"]').forEach(b=>{ b.classList.toggle("pending", st === "wait"); b.classList.toggle("failed", st === "fail"); });
  const el = document.getElementById("syncline"); if(el) el.outerHTML = syncRow();
}
function syncRow(){
  const st = syncState();
  const txt = { ok:"Alles bewaard in de cloud", busy:"Bezig met bewaren…",
    wait:"Geen internet: wijzigingen staan op dit toestel en gaan door zodra er verbinding is",
    off:"Geen internet: nieuwe wijzigingen worden later doorgestuurd",
    fail:"Niet alles kon bewaard worden (" + SYNC.lastErr + "). Tik op Opslag nakijken." }[st];
  return '<div class="row" id="syncline"><span class="syncdot '+({ ok:"", busy:"", wait:"wait", off:"off", fail:"fail" }[st])+'"></span>'+
         '<div class="grow"><div class="s" style="margin:0;white-space:normal">'+txt+'</div></div></div>';
}
window.addEventListener("online", paintSync);
window.addEventListener("offline", paintSync);

function shortOf(p){
  if(!p) return "";
  const f = (p.f||p.first||"").trim(), l = (p.l||p.last||"").trim();
  return (f + (l ? " " + l.charAt(0).toUpperCase() + "." : "")).trim();
}
function fullOf(p){ return p ? (((p.f||"") + " " + (p.l||"")).trim()) : ""; }
function userShort(){ return shortOf(PROFILE); }
function userFull(){ return PROFILE ? ((PROFILE.first||"") + " " + (PROFILE.last||"")).trim() : ""; }

/* ---------- helpers ---------- */
const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function mmss(ms){ ms = Math.max(0, Math.round(ms/1000)); return Math.floor(ms/60) + ":" + String(ms%60).padStart(2,"0"); }
function mmssUp(ms){ return mmss(Math.ceil(Math.max(0,ms)/1000)*1000); }
function partLimit(m){ return m.cfg.partMin * 60000; }
function prevPartsMs(m, upto){ let t = 0; for(let i=0;i<upto;i++) t += m.clock.parts[i] || 0; return t; }
function overtimeText(ms){ return ms >= 1000 ? " — " + mmss(ms) + " extra tijd" : ""; }
function hmm(ms){ const t = Math.max(0, Math.round(ms/1000)), h = Math.floor(t/3600), m = Math.floor(t%3600/60);
  return h > 0 ? h + "u" + String(m).padStart(2,"0") : m + " min"; }
function dateNL(iso){ if(!iso) return ""; const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("nl-BE",{day:"numeric",month:"short",year:"numeric"}); }
function toast(msg, ms){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), ms || 1900);
}
function ordinalPart(i, total){
  if(total === 2) return (i===0?"1e":"2e") + " helft";
  if(total === 4) return "Q" + (i+1);
  return "Deel " + (i+1);
}

    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return; AC = new C(); }
    if(AC.state === "suspended") AC.resume();
  }catch(e){ AC = null; }

function beeps(){
  if(!AC) return;
  try{
    const t0 = AC.currentTime;
    [[0,880],[0.30,880],[0.60,1320]].forEach(([off,f])=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0+off);
      g.gain.exponentialRampToValueAtTime(0.35, t0+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+off+0.26);
      o.connect(g); g.connect(AC.destination);
      o.start(t0+off); o.stop(t0+off+0.3);
    });
  }catch(e){}
}
function alarm(){
  try{ if(navigator.vibrate) navigator.vibrate([300,120,300,120,500]); }catch(e){}
  beeps();
}

/* ---------- bediening van een lopende wedstrijd ----------
   m.ctrl = { uid, dev, name, n, beat }: welk toestel bedient. n telt op bij elke overname,
   zodat de databank oude, nog niet doorgestuurde wijzigingen van het vorige toestel weigert. */
const DEV = (()=>{ try{ let d = localStorage.getItem("hbm.dev"); if(!d){ d = Date.now().toString(36) + Math.random().toString(36).slice(2,9); localStorage.setItem("hbm.dev", d); } return d; }catch(e){ return "dev-" + Math.random().toString(36).slice(2); } })();
function myCtrl(n){ return { uid:USER.uid, dev:DEV, name:userShort(), n:n||1, beat:Date.now() }; }
function canControl(m){ return !!m && m.status === "live" && (!m.ctrl || m.ctrl.dev === DEV); }
function isViewer(m){ return !!m && m.status === "live" && !!m.ctrl && m.ctrl.dev !== DEV; }
/* vóór elke actie op de open wedstrijd */
function ctl(){
  const m = match(); if(!m) return false;
  if(m.status !== "live") return true;
  if(isViewer(m)){ toast("Je kijkt mee. Tik op Overnemen om zelf te bedienen."); return false; }
  if(!m.ctrl) m.ctrl = myCtrl(1);
  m.ctrl.beat = Date.now();
  return true;
}
function beatAge(m){ return m && m.ctrl && m.ctrl.beat ? Math.max(0, Date.now() - m.ctrl.beat) : Infinity; }
function askTakeover(){
  const m = match(); if(!m || !isViewer(m)) return;
  if(!navigator.onLine){ toast("Om over te nemen is internet nodig"); return; }
  const age = beatAge(m), who = m.ctrl.name || "een ander toestel";
  const ageTxt = age < 90000 ? "Dat toestel was net nog actief." : "Het laatste teken van dat toestel is van " + Math.round(age / 60000) + " min geleden.";
  openModal("Bediening overnemen",
    '<p class="muted"><b>'+esc(who)+'</b> bedient deze wedstrijd nu. '+ageTxt+'</p>'+
    '<p class="muted">Neem je over, dan bedien jij de klok, wissels, doelpunten en kaarten, en kijkt dat toestel voortaan mee. Wat daar nog niet doorgestuurd was, gaat verloren.</p>'+
    '<div class="pad"><button class="btn" onclick="doTakeover()">Bediening overnemen</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal()">Blijven meekijken</button></div>');
}
function doTakeover(){
  const m = match(); if(!m || m.status !== "live") return;

/* ---------- clubdatabank ---------- */
const CLUB_STOP = ["koninklijke","kon","royal","roy","r","k","hockeyclub","hockey","club","hc","khc","rhc","thc","mhc","ahc","vzw","asbl","de","het","the","le","la"];
function normClub(t){
  const w = String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\./g,"").replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(Boolean);
  const k = w.filter(x=> CLUB_STOP.indexOf(x) < 0);
  return (k.length ? k : w).join("");
}
function lev(a, b){
  if(a === b) return 0;
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,j)=> j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
/* clubs die er hard op lijken: zelfde kern, kleine tikfout, of de ene naam zit in de andere */
function similarClubs(name, exceptId){
  const n = normClub(name); if(!n) return [];
  return Object.values(CLUBS).filter(c=> c.id !== exceptId).map(c=>{
    const cn = c.norm || normClub(c.name);
    let d = lev(n, cn);
    if(n.length >= 4 && cn.length >= 4 && (cn.indexOf(n) >= 0 || n.indexOf(cn) >= 0)) d = Math.min(d, 1);
    return { c, d };
  }).filter(x=> x.d <= (n.length <= 5 ? 1 : 2)).sort((a,b)=> a.d - b.d || a.c.name.localeCompare(b.c.name)).map(x=> x.c);
}
function clubSuggestions(typed){
  const n = normClub(typed); if(n.length < 2) return [];
  const pre = Object.values(CLUBS).filter(c=> (c.norm||"").indexOf(n) === 0 || normName(c.name).indexOf(normName(typed)) === 0);
  const sim = similarClubs(typed);
  const out = []; [...pre, ...sim].forEach(c=>{ if(out.indexOf(c) < 0) out.push(c); });
  return out.slice(0, 4);
}
function createClub(name){
  const F = window.FB, id = uid();
  const c = { id, name, norm:normClub(name), createdBy:USER.uid, createdByName:userShort(), created:Date.now() };
  CLUBS[id] = { id, name, norm:c.norm };
  const b = F.writeBatch(F.db);
  b.set(F.doc(F.db, "clubs", id), Object.assign({}, c, { updatedAt:F.serverTimestamp(), updatedBy:USER.uid }));
  trackCommit(b);
  return id;
}
function renameClub(clubId, viaTeam, name){
  const F = window.FB, c = CLUBS[clubId]; if(!c) return;
  const old = c.name;
  c.name = name; c.norm = normClub(name);
  const b = F.writeBatch(F.db);
  b.update(F.doc(F.db, "clubs", clubId), { name, norm:c.norm, viaTeam, updatedAt:F.serverTimestamp(), updatedBy:USER.uid });
  b.set(F.doc(F.db, "clubs", clubId, "history", uid()), { old, name, by:USER.uid, byName:userShort(), at:F.serverTimestamp() });
  trackCommit(b).then(ok=>{ if(!ok){ c.name = old; c.norm = normClub(old); render(); } });
  save(true);          /* teamoverzicht met de nieuwe naam */
}
function seasonStartYear(d){ d = d || new Date(); return d.getMonth() >= 5 ? d.getFullYear() : d.getFullYear() - 1; }
function seasonLabel(y){ return y + "–" + (y + 1); }
function normName(t){ return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
function newMatch(se, d){
  const m = { id:uid(), date:d.date, opponent:d.opponent, venue:d.venue,
    cfg:{ sport:"hockey", parts:d.parts, partMin:d.partMin, onField:d.onField },
    status:"live", created:Date.now(), appVersion:APP_VERSION, createdBy:USER.uid,
    clock:{ part:0, parts:new Array(d.parts).fill(0), running:false, since:null, otLog:[] },
    score:{ us:0, them:0 }, players:{}, log:[], ctrl:myCtrl(1) };
  d.squad.forEach(p=>{
    m.players[p.n] = { n:p.n, f:p.f||"", l:p.l||"", status:p.start?"field":"bench",
      fieldMs:0, benchMs:0, suspMs:0, subs:0, since:0, longestBench:0, cards:[], susp:null, ready:false, goals:0 };
  });
  se.matches.unshift(m); return m;
}
function elapsedPart(m,i){ const c = m.clock, b = c.parts[i]||0;
  return (c.running && c.part===i && c.since) ? b + (Date.now()-c.since) : b; }
function elapsedTotal(m){ let t = 0; for(let i=0;i<m.clock.parts.length;i++) t += elapsedPart(m,i); return t; }
function liveOf(p,T){ const d = Math.max(0, T - p.since);
  return { field:p.fieldMs + (p.status==="field"?d:0), bench:p.benchMs + (p.status==="bench"?d:0),
           susp:p.suspMs + (p.status==="susp"?d:0), spell:d }; }
function commit(m,p,T){
  const d = Math.max(0, T - p.since);
  if(p.status==="field") p.fieldMs += d;
  else if(p.status==="bench"){ p.benchMs += d; if(d > p.longestBench) p.longestBench = d; }
  else if(p.status==="susp") p.suspMs += d;
  p.since = T;
}
function logEv(m, text){ const e = { t:elapsedTotal(m), part:m.clock.part, wall:Date.now(), text }; const by = userShort(); if(by) e.by = by; m.log.push(e); }
function playersArr(m){ return Object.values(m.players).sort((a,b)=> (+a.n)-(+b.n) || String(a.n).localeCompare(String(b.n))); }
function onFieldNow(m){ return playersArr(m).filter(p=>p.status==="field"); }
/* bank: wie deze keer het langst zit staat eerst (vroegste 'since'), bij gelijkstand op rugnummer */
function benchByWait(m){
  return Object.values(m.players).filter(p=>p.status==="bench")
    .sort((a,b)=> (a.since - b.since) || ((+a.n) - (+b.n)) || String(a.n).localeCompare(String(b.n)));
}
/* straftijd: wie het eerst terug mag staat eerst */
function suspBySoonest(m){
  return Object.values(m.players).filter(p=>p.status==="susp" && p.susp)
    .sort((a,b)=> (a.susp.until - b.susp.until) || ((+a.n) - (+b.n)));
}

/* ---------- acties ---------- */
function toggleClock(){
  if(!ctl()) return;
  const m = match(); if(!m) return;
  audioOn();
  const c = m.clock;
  if(c.running){
    c.parts[c.part] = elapsedPart(m,c.part); c.running = false; c.since = null;
    const inOvertime = c.parts[c.part] >= partLimit(m);
    logEv(m, inOvertime ? "Klok gepauzeerd tijdens extra tijd" : "Klok gepauzeerd");
    save(true); renderMatch();
    if(inOvertime) endPrompt();
    return;
  }
  c.since = Date.now(); c.running = true;
  logEv(m, c.parts[c.part]===0 ? ordinalPart(c.part,m.cfg.parts)+" gestart" : "Klok hervat");
  save(true); renderMatch();
}
function endPrompt(){
  const m = match(), c = m.clock, last = c.part >= m.cfg.parts-1;
  const part = ordinalPart(c.part, m.cfg.parts).toLowerCase();
  const ot = Math.max(0, c.parts[c.part] - partLimit(m));
  openModal("Tijd is om",
    '<p class="muted">De reguliere tijd van de '+part+' is voorbij, er is <b class="num">'+mmss(ot)+'</b> extra tijd gespeeld. De klok staat stil.</p>'+
    '<div class="pad"><button class="btn" onclick="'+(last?'finishMatch()':'endPart()')+'">'+
      (last ? 'Wedstrijd beëindigen op '+m.score.us+'–'+m.score.them : 'Einde '+part)+'</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal()">Enkel pauzeren</button></div>');
}
function nudgeClock(ms){
  if(!ctl()) return;
  const m = match(); if(!m) return;
  const c = m.clock;
  c.parts[c.part] = Math.max(0, elapsedPart(m,c.part) + ms);
  if(c.running) c.since = Date.now();
  const T = elapsedTotal(m);
  playersArr(m).forEach(p=>{ if(p.since > T) p.since = T; });
  logEv(m, (ms>0?"+":"−") + (Math.abs(ms)>=60000 ? Math.abs(Math.round(ms/60000))+" min" : Math.abs(ms/1000)+" sec") + " op de klok");
  save(true); paint();
}
function endPart(){
  if(!ctl()) return;
  const m = match(); const c = m.clock;
  c.parts[c.part] = elapsedPart(m,c.part); c.running = false; c.since = null;
  const ot = c.parts[c.part] - partLimit(m);
  logEv(m, "Einde " + ordinalPart(c.part,m.cfg.parts).toLowerCase() + overtimeText(ot));
  if(c.part < m.cfg.parts-1) c.part++;
  save(true); closeModal(); renderMatch();
}
function finishMatch(){
  if(!ctl()) return;
  const m = match(); const T = elapsedTotal(m);
  m.clock.parts[m.clock.part] = elapsedPart(m,m.clock.part);
  m.clock.running = false; m.clock.since = null;
  playersArr(m).forEach(p=> commit(m,p,T));
  const ot = m.clock.parts[m.clock.part] - partLimit(m);
  if(ot >= 1000) logEv(m, "Einde " + ordinalPart(m.clock.part,m.cfg.parts).toLowerCase() + overtimeText(ot));
  m.status = "done"; m.totalMs = T;
  logEv(m, "Wedstrijd beëindigd — " + m.score.us + "–" + m.score.them);
  save(true); closeModal(); go("summary");
}
function sub(outN, inN){
  if(!ctl()) return;
  const m = match(); const T = elapsedTotal(m);
  const a = m.players[outN], b = m.players[inN];
  if(!a || !b) return;
  commit(m,a,T); commit(m,b,T);
  a.status = "bench"; b.status = "field"; a.ready = false; b.ready = false;
  a.subs++; b.subs++;
  logEv(m, b.n + " " + dispName(b) + " in voor " + a.n + " " + dispName(a));
  save(true); renderMatch();
  toast(b.n + " in · " + a.n + " uit");
}
function giveCard(n, type){
  if(!ctl()) return;
  const m = match(); const T = elapsedTotal(m), p = m.players[n], def = CARD_DEF[type];
  commit(m,p,T);
  p.cards.push({ type, at:T });
  if(type === "rood"){ p.status = "out"; p.susp = null; }
  else { p.status = "susp"; p.susp = { type, until: T + def.ms }; }
  p.ready = false;
  logEv(m, def.label + " voor " + p.n + " " + dispName(p) + (def.ms ? " — " + (def.ms/60000) + " min" : ""));
  save(true); closeModal(); renderMatch();
}
function backFromSusp(n, toField){
  if(!ctl()) return;
  const m = match(); const T = elapsedTotal(m), p = m.players[n];
  commit(m,p,T); p.status = toField ? "field" : "bench"; p.susp = null; p.ready = false;
  logEv(m, p.n + " " + dispName(p) + " terug " + (toField ? "op het veld" : "op de bank"));
  save(true); closeModal(); renderMatch();
}
function goal(side, scorerN){
  if(!ctl()) return;
  const m = match(); const se = season();
  m.score[side]++;
  let txt = side==="us" ? "Doelpunt " + usName(se) : "Tegendoelpunt";
  if(scorerN){ const p = m.players[scorerN]; if(p){ p.goals = (p.goals||0)+1; txt += " — " + p.n + " " + dispName(p); } }
  logEv(m, txt + " (" + m.score.us + "–" + m.score.them + ")");
  save(true); closeModal(); renderMatch();
}
function unGoal(side, scorerN){
  if(!ctl()) return;
  const m = match(); if(m.score[side] <= 0) return;
  m.score[side]--;
  if(scorerN && m.players[scorerN] && m.players[scorerN].goals > 0) m.players[scorerN].goals--;
  logEv(m, "Doelpunt gecorrigeerd (" + m.score.us + "–" + m.score.them + ")");
  save(true); closeModal(); renderMatch();
}
function setName(n, f, l){
  if(!ctl()) return;
  const m = match(), se = season(), p = m.players[n];
  p.f = f.trim(); p.l = l.trim();
  se.roster[n] = { f:p.f, l:p.l };
  save(true); closeModal(); renderMatch();
}

/* ---------- navigatie ---------- */
let VIEW = "home";
function go(v){ VIEW = v; closeModal(true); render(); window.scrollTo(0,0); }
function render(){
  const main = $("#view");
  if(INAPP){ main.className = ""; $("#dock").hidden = true; renderInApp(); return; }
  main.className = (VIEW === "match") ? "no-scroll" : "";
  $("#dock").hidden = true; $("#dock").innerHTML = "";
  if(!USER && VIEW !== "boot") VIEW = "login";
  if(USER && !READY && VIEW !== "profile") VIEW = "boot";
  ({ boot:renderBoot, login:renderLogin, profile:renderProfile,
     home:renderHome, season:renderSeason, setup:renderSetup, match:renderMatch,
     summary:renderSummary, seasonstats:renderSeasonStats, members:renderMembers, roster:renderRoster, trash:renderTrash }[VIEW] || renderHome)();
  paintSync();
}
function nav(h){ $("#nav").innerHTML = h; }
function navTitle(t, sub, act){
  const inner = esc(t) + (sub ? '<span class="nav-sub">'+esc(sub)+'</span>' : '');
  return act ? '<button class="nav-title" onclick="'+act+'">'+inner+'</button>'
             : '<div class="nav-title">'+inner+'</div>';
}
function backBtn(v){ return '<button class="nav-btn" onclick="go(\''+v+'\')">'+svg.back+'</button>'; }
function menuBtn(){ const st = syncState(); return '<button class="nav-btn'+(st==="wait"?" pending":st==="fail"?" failed":"")+'" onclick="openMenu()" aria-label="Menu">'+svg.menu+'</button>'; }

  h += '<button class="row" onclick="about()"><div class="grow"><div class="t">Zo werkt de app</div></div><span class="chev">'+svg.chev+'</span></button>';

    '<p>De grote klok telt per helft af. Bij nul wordt ze rood en telt ze de extra tijd op; die komt ook in de log. Druk je tijdens de extra tijd op pauze, dan vraagt de app of je de helft wil beëindigen.</p>'+
    '<p>Op elke spelerkaart zie je de totale veldtijd (blauw) en de totale banktijd (oranje) van deze wedstrijd. Zit iemand nu op de bank, dan staat eronder hoelang die er deze keer al zit. Rechtsonder op de kaart staat het aantal wissels, en een groen bolletje bij het rugnummer toont gemaakte doelpunten.</p>'+
    '<p>In de balk onderaan zie je iedereen op de bank met de tijd van deze bankbeurt. Wie het langst zit staat links en is licht gemarkeerd: dat is wie als eerste terug het veld in kan. Ook bij het wisselen staat de bank in die volgorde.</p>'+
    '<p>Een groene kaart staat op 2 minuten, een gele op 5. De strafbank krijgt de kleur van de kaart. Loopt de straf af, dan trilt en piept de telefoon en gaat de speler automatisch terug het veld in, even blauw gemarkeerd. Wil je dat niet, tik de speler dan aan en zet hem of haar op de bank.</p>'+
    '<p>Een lopende wedstrijd wordt door één toestel bediend. Wie de wedstrijd op een ander toestel opent, kijkt live mee. Valt het bedienende toestel uit, dan kan een ander toestel de bediening overnemen met de knop Overnemen.</p>'+
    '<p>Alles wordt automatisch in de cloud bewaard onder je account. Zo zie je dezelfde teams op elk toestel waar je aanmeldt. Zonder internet werkt de app gewoon verder: wijzigingen blijven op dit toestel staan en gaan door zodra er weer verbinding is. Het oranje bolletje op de menuknop betekent dat er nog iets moet doorgaan.</p>'+
    '<p style="color:var(--text2);border-top:.5px solid var(--sep);padding-top:12px;margin-top:16px">'+
    'Deze app is speciaal gemaakt voor Anneliese van KHC Dragons. Vragen of ideeën: <a href="mailto:'+CONTACT_MAIL+'" style="color:var(--tint)">'+CONTACT_MAIL+'</a></p>'+

      (S.seasons.length ? '<button class="nav-btn txt" onclick="homeEdit=!homeEdit;renderHome()">'+(homeEdit?"Klaar":"Wijzig")+'</button>' : '<div style="width:44px"></div>'));

    h += '<p class="muted" style="margin-bottom:14px">Nog geen teams. Een team hoort bij één seizoen, bijvoorbeeld KHC Dragons – U12 D1 in 2026–2027. Heeft iemand jouw team al aangemaakt, vraag die persoon dan een uitnodiging.</p>';

         '<div class="s" style="white-space:normal">Voor een team dat al bestaat.</div></div><span class="chev">'+svg.chev+'</span></button></div>';
    h += '<div class="card" style="margin-top:14px"><button class="row" onclick="importBackup()"><div class="grow"><div class="t">Back-up terugzetten</div>'+
         '<div class="s" style="white-space:normal">Een back-up die je eerder maakte, als bestand of als tekst.</div></div><span class="chev">'+svg.chev+'</span></button></div>';

function openSeason(id){ S.activeSeason = id; save(true); go("season"); }
function seasonOptions(sel){
  const y = seasonStartYear(), opts = [seasonLabel(y-1), seasonLabel(y), seasonLabel(y+1)];
  if(sel && opts.indexOf(sel) < 0) opts.unshift(sel);
  return opts.map(o=> '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>').join("");
}
const CODE_HELP = 'Een code krijg je van een hoofdgebruiker van het team, via Leden → Iemand uitnodigen. Je krijgt dan een bericht met een link en een code zoals STICK-42. Die werkt één keer en 24 uur.';

  openModal("Team toevoegen",
    '<div class="card"><button class="opt" onclick="joinSheet()"><span style="flex:1"><span style="display:block">Ik heb een code</span>'+
      '<span style="display:block;font-size:13px;color:var(--text2)">voor een team dat al bestaat</span></span><span class="chev">'+svg.chev+'</span></button>'+
    '<button class="opt" onclick="askSeason()"><span style="flex:1"><span style="display:block">Nieuw team aanmaken</span>'+
      '<span style="display:block;font-size:13px;color:var(--text2)">je wordt er hoofdgebruiker van</span></span><span class="chev">'+svg.chev+'</span></button></div>'+
    '<p class="muted" style="margin-top:14px">'+CODE_HELP+'</p><div style="height:10px"></div>');
}
let NT = null;   /* nieuw team in opbouw */
function askSeason(){
  const last = S.seasons.find(x=> clubName(x));
  NT = { club: last ? clubName(last) : "", team:"", season: seasonLabel(seasonStartYear()), clubId:null };
  drawNewTeam();
}
function drawNewTeam(){
  openModal("Nieuw team",
    '<div class="card"><div class="row"><label class="lbl" for="sClub">Club</label><input type="text" id="sClub" value="'+esc(NT.club)+'" placeholder="bv. KHC Dragons" autocomplete="off"></div>'+
    '<div id="clubSug"></div>'+
    '<div class="row"><label class="lbl" for="sTeam">Team</label><input type="text" id="sTeam" value="'+esc(NT.team)+'" placeholder="bv. U12 D1" autocomplete="off"></div>'+
    '<div class="row"><label class="lbl" for="sName">Seizoen</label><select id="sName">'+seasonOptions(NT.season)+'</select></div></div>'+
    '<p class="muted">Elk seizoen krijgt een eigen team, ook als de naam hetzelfde blijft. Spelers van vorig seizoen kan je zo meteen overnemen.</p>'+
    '<div class="pad"><button class="btn" id="sGo">Verder</button></div>',
    { onMount(mo){
        const c = mo.querySelector("#sClub"), t = mo.querySelector("#sTeam"), sg = mo.querySelector("#clubSug");
        const sug = ()=>{
          const exact = Object.values(CLUBS).some(x=> x.name.trim().toLowerCase() === c.value.trim().toLowerCase());
          const list = exact ? [] : clubSuggestions(c.value);
          sg.innerHTML = list.map(x=> '<button class="opt" data-club="'+esc(x.id)+'" style="padding:10px 16px 10px 32px;font-size:15px;color:var(--tint)">'+esc(x.name)+'</button>').join("");
          sg.querySelectorAll("[data-club]").forEach(el=> el.onclick = ()=>{ c.value = CLUBS[el.dataset.club].name; sug(); t.focus(); });
        };
        c.addEventListener("input", sug); sug();
        const fire = ()=>{
          NT.club = c.value.trim(); NT.team = t.value.trim(); NT.season = mo.querySelector("#sName").value;
          if(!NT.club){ c.focus(); toast("Geef de club"); return; }
          if(!NT.team){ t.focus(); toast("Geef een teamnaam"); return; }
          checkClub();
        };
        mo.querySelector("#sGo").onclick = fire;
        [c,t].forEach(el=> el.addEventListener("keydown", e=>{ if(e.key === "Enter") fire(); }));
        setTimeout(()=>{ try{ (NT.club ? t : c).focus(); }catch(e){} }, 220);
      }});
}
/* stap 1: bestaat de club al (of iets dat er hard op lijkt)? */
function checkClub(){
  const n = normClub(NT.club);
  const same = Object.values(CLUBS).find(x=> x.name.trim().toLowerCase() === NT.club.toLowerCase())
            || Object.values(CLUBS).find(x=> x.norm === n);
  if(same){ NT.clubId = same.id; NT.club = same.name; return checkTeam(); }
  const sim = similarClubs(NT.club);
  if(!sim.length){ NT.clubId = null; return checkTeam(); }
  let h = '<p class="muted">Er bestaat al een club die er hard op lijkt. Gebruik liefst die, dan vinden teamgenoten elkaar makkelijker.</p><div class="card">';
  sim.slice(0,4).forEach(x=>{
    h += '<button class="opt" data-pick="'+esc(x.id)+'"><span style="flex:1">'+esc(x.name)+'</span><span style="color:var(--tint);font-size:14px;font-weight:600">gebruiken</span></button>';
  });
  h += '</div><div class="pad"><button class="btn ghost" id="cNew">Nieuwe club "'+esc(NT.club)+'" aanmaken</button></div>'+
       '<div class="pad" style="padding-top:0"><button class="btn ghost" id="cBack">Terug</button></div>';
  openModal("Bedoel je deze club?", h, { onMount(mo){
    mo.querySelectorAll("[data-pick]").forEach(el=> el.onclick = ()=>{ NT.clubId = el.dataset.pick; NT.club = CLUBS[NT.clubId].name; checkTeam(); });
    mo.querySelector("#cNew").onclick = ()=>{ NT.clubId = null; checkTeam(); };
    mo.querySelector("#cBack").onclick = drawNewTeam;
  }});
}
/* stap 2: heb je dit team zelf al, of bestaat het al bij iemand anders? */
async function checkTeam(){
  const key = normName(NT.team);
  const mine = S.seasons.find(x=> x.name === NT.season && normName(x.team) === key &&
    ((NT.clubId && x.clubId === NT.clubId) || normClub(clubName(x)) === normClub(NT.club)));
  if(mine) return confirmTwinTeam(mine);
  if(NT.clubId && navigator.onLine && window.FB){
    const F = window.FB;
    try{
      const snap = await F.getDocs(F.query(F.collection(F.db, "directory"), F.where("clubId", "==", NT.clubId), F.where("season", "==", NT.season)));
      const hits = snap.docs.map(d=> d.data()).filter(d=> !S.seasons.some(x=> x.id === d.teamId))
        .filter(d=> d.norm === key || (key.length >= 3 && lev(d.norm||"", key) <= 1));
      if(hits.length) return confirmElsewhere(hits);
    }catch(e){ console.warn("teamoverzicht niet bereikbaar", e); }
  }
  createTeamFlow();
}
function confirmTwinTeam(twin){
  openModal("Dit team bestaat al",
    '<p class="muted">Je hebt al <b>'+esc(teamLabel(twin))+'</b> in '+esc(twin.name)+', met '+twin.matches.length+' wedstrijd'+(twin.matches.length===1?"":"en")+'. Wil je dat team openen?</p>'+
    '<div class="pad"><button class="btn" onclick="openSeason(\''+twin.id+'\')">Bestaand team openen</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="createTeamFlow()">Toch een nieuw team aanmaken</button></div>');
}
function confirmElsewhere(hits){
  let h = '<p class="muted">Dit team lijkt al te bestaan. Word je liever lid van het bestaande team? Dan zie je dezelfde spelers en wedstrijden als je teamgenoten.</p><div class="card">';
  hits.slice(0,3).forEach(d=>{
    const who = (d.admins||[]).join(", ");
    h += '<div class="row"><div class="grow"><div class="t">'+esc((CLUBS[d.clubId] ? CLUBS[d.clubId].name : d.club) + " – " + d.team)+'</div>'+
         '<div class="s" style="white-space:normal">'+esc(d.season)+(who ? ' · vraag een code aan '+esc(who) : '')+'</div></div></div>';
  });
  h += '</div><p class="muted" style="margin-top:12px">'+CODE_HELP+'</p>'+
       '<div class="pad"><button class="btn" onclick="joinSheet()">Ik heb een code</button></div>'+
       '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="createTeamFlow()">Toch een nieuw team aanmaken</button></div>';
  openModal("Bestaat dit team al?", h);
}
function createTeamFlow(){
  const clubId = NT.clubId || createClub(NT.club);
  const s = newTeam(clubId, NT.club, NT.team, NT.season);
  NT = null;
  closeModal(true);
  carryStart(s.id);
}
let carrySel = null;
function carryStart(newId){
  const others = S.seasons.filter(s=> s.id !== newId && Object.keys(s.roster||{}).length);
  if(!others.length){ go("roster"); return; }
  if(others.length === 1){ carrySheet(newId, others[0].id); return; }
  let h = '<p class="muted">Uit welk team wil je spelers overnemen?</p><div class="card">';
  others.forEach(s=>{
    h += '<button class="opt" onclick="carrySheet(\''+newId+'\',\''+s.id+'\')"><span style="flex:1">'+
      '<span style="display:block">'+esc(teamLabel(s))+'</span>'+
      '<span style="display:block;font-size:13px;color:var(--text2)">'+esc(s.name)+' · '+Object.keys(s.roster).length+' spelers</span></span>'+
      '<span class="chev">'+svg.chev+'</span></button>';
  });
  h += '</div><div class="pad"><button class="btn ghost" onclick="closeModal();go(\'season\')">Leeg beginnen</button></div>';
  openModal("Spelers overnemen", h);
}
function carrySheet(newId, srcId){
  const src = S.seasons.find(s=>s.id===srcId);
  if(!src){ go("season"); return; }
  const ns = Object.keys(src.roster).sort((a,b)=>a-b);
  carrySel = new Set(ns);
  let h = '<p class="muted">Kies wie mee overgaat naar het nieuwe team. Je kan later altijd nummers bijzetten.</p>';
  h += '<div class="pad" style="padding-bottom:8px;display:flex;gap:8px">'+
       '<button class="btn ghost" id="cAll" style="height:40px;font-size:15px">Allemaal</button>'+
       '<button class="btn ghost" id="cNone" style="height:40px;font-size:15px">Geen</button></div>';
  h += '<div class="card">';
  ns.forEach(n=>{
    const r = src.roster[n] || {};
    h += '<button class="opt" data-n="'+esc(n)+'" style="background:var(--tint-soft)">'+
      '<span class="badge num">'+esc(n)+'</span>'+
      '<span style="flex:1">'+esc(((r.f||"") + " " + (r.l||"")).trim() || "geen naam")+'</span>'+
      '<span class="mk" style="color:var(--tint);font-weight:700;font-size:18px;width:20px;text-align:center">✓</span></button>';
  });
  h += '</div><div class="pad"><button class="btn" id="cGo"></button></div>'+
       '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal();go(\'season\')">Leeg beginnen</button></div>';
  openModal("Spelers overnemen", h, { onMount(mo){
    const upd = ()=>{
      mo.querySelector("#cGo").textContent = carrySel.size
        ? carrySel.size + " speler" + (carrySel.size===1?"":"s") + " overnemen"
        : "Niemand overnemen";
      mo.querySelectorAll("[data-n]").forEach(el=>{
        const on = carrySel.has(el.dataset.n);
        el.style.background = on ? "var(--tint-soft)" : "var(--surface)";
        el.querySelector(".mk").textContent = on ? "✓" : "";
      });
    };
    mo.querySelectorAll("[data-n]").forEach(el=> el.onclick = ()=>{
      const n = el.dataset.n;
      if(carrySel.has(n)) carrySel.delete(n); else carrySel.add(n);
      upd();
    });
    mo.querySelector("#cAll").onclick  = ()=>{ ns.forEach(n=>carrySel.add(n)); upd(); };
    mo.querySelector("#cNone").onclick = ()=>{ carrySel.clear(); upd(); };
    mo.querySelector("#cGo").onclick   = ()=> carryDo(newId, srcId);
    upd();
  }});
}
function carryDo(newId, srcId){
  const dst = S.seasons.find(s=>s.id===newId), src = S.seasons.find(s=>s.id===srcId);
  let k = 0;
  if(dst && src){
    carrySel.forEach(n=>{ const r = src.roster[n]; if(r){ dst.roster[n] = { f:r.f||"", l:r.l||"" }; k++; } });
  }
  save(true); closeModal(); go(k ? "season" : "roster");
  if(k) toast(k + " speler" + (k===1?"":"s") + " overgenomen");
}
function editSeasonName(id){
  const s = S.seasons.find(x=>x.id===id); if(!s) return;
  openModal("Team aanpassen",
    '<div class="card"><button class="row" onclick="clubSheet(\''+s.id+'\')"><div class="grow"><div class="t">Club</div></div>'+
    '<div class="v">'+esc(clubName(s) || "kiezen")+'</div><span class="chev">'+svg.chev+'</span></button>'+
    '<div class="row"><label class="lbl" for="eTeam">Team</label>'+
    '<input type="text" id="eTeam" value="'+esc(s.team||"")+'" autocomplete="off"></div>'+
    '<div class="row"><label class="lbl" for="eSeas">Seizoen</label><select id="eSeas">'+seasonOptions(s.name)+'</select></div></div>'+
    '<div class="pad"><button class="btn" id="eGo">Bewaren</button></div>',
    { onMount(mo){
        const a = mo.querySelector("#eTeam"), b = mo.querySelector("#eSeas");
        const fire = ()=>{
          const t = a.value.trim();
          if(!t){ a.focus(); toast("Geef een teamnaam"); return; }
          s.team = t; s.name = b.value || s.name;
          save(true); closeModal(); render();
        };
        mo.querySelector("#eGo").onclick = fire;
        a.addEventListener("keydown", e=>{ if(e.key==="Enter") fire(); });
      }});
}
/* clubnaam verbeteren: geldt voor alle teams van die club, bij iedereen */

    '<div class="pad"><button class="btn" id="kGo">Naam verbeteren</button></div>',
    { onMount(mo){

          if(!v){ el.focus(); toast("Geef een naam"); return; }

              '<div class="pad"><button class="btn" id="kYes">Toch hernoemen naar "'+esc(v)+'"</button></div>'+
              '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal()">Annuleren</button></div>',

            return;
          }
          renameClub(c.id, se.id, v); closeModal(); render(); toast("Clubnaam aangepast");
        };
        mo.querySelector("#kGo").onclick = fire;
        el.addEventListener("keydown", e=>{ if(e.key==="Enter") fire(); });
      }});

/* ---------- wedstrijd opzetten ---------- */
let setupState = null;
function renderSetup(){
  const se = season(); if(!se) return go("home");
  if(!setupState){
    const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    setupState = { date:d.toISOString().slice(0,10), opponent:"", venue:"home",
      parts:2, partMin:35, onField:11, adv:false,
      squad: Object.keys(se.roster).sort((a,b)=>a-b).map(n=>({ n, f:(se.roster[n]||{}).f||"", l:(se.roster[n]||{}).l||"", in:false, start:false })) };
  }
  const st = setupState;
  nav(backBtn("season") + navTitle("Nieuwe wedstrijd") + '<div style="width:44px"></div>');

  let h = '<div class="sec">Wedstrijd</div><div class="card">';
  h += '<div class="row"><label class="lbl" for="opp">Tegenstander</label><input type="text" id="opp" value="'+esc(st.opponent)+'" placeholder="clubnaam" autocomplete="off"></div>';
  h += '<div class="row"><label class="lbl" for="dt">Datum</label><input type="date" id="dt" value="'+st.date+'"></div>';
  h += '<div class="row"><div class="grow"><div class="t">Waar</div></div><div class="seg" style="width:168px">'+
       '<button aria-pressed="'+(st.venue==="home")+'" onclick="setupSet(\'venue\',\'home\')">Thuis</button>'+
       '<button aria-pressed="'+(st.venue==="away")+'" onclick="setupSet(\'venue\',\'away\')">Uit</button></div></div>';

  h += '<p class="muted" style="margin-top:0">Tik een rugnummer aan om de speler te selecteren. De eerste '+st.onField+' worden basis, de rest bank. Tik op het label om dat om te draaien.</p>';
  h += '<div class="card" id="squadList">';

       '<button onclick="setupAdd()" style="color:var(--tint);font-weight:600;padding:8px 10px">Voeg toe</button></div></div>';
  h += '<p class="muted" id="cnt"></p>';

  h += '<div class="sec">Geavanceerde wedstrijdinstellingen</div><div class="card">';
  if(!st.adv){
    h += '<button class="row" onclick="setupSet(\'adv\',true)"><div class="grow"><div class="t">Tonen</div><div class="s">'+
         st.parts+' delen · '+st.onField+' spelers op het veld</div></div><span class="chev">'+svg.chev+'</span></button>';
  }else{
    h += '<div class="row"><div class="grow"><div class="t">Aantal delen</div></div>'+stepper("parts",st.parts,1,1,4)+'</div>';
    h += '<div class="row"><div class="grow"><div class="t">Spelers op het veld</div></div>'+stepper("onField",st.onField,1,3,15)+'</div>';
  }
  h += '</div>';
  h += '<div class="pad" id="goWrap"></div>';
  $("#view").innerHTML = h;

  $("#dt").oninput  = e=>{ st.date = e.target.value; };

  nn.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); setupAdd(); } });

function squadRowHTML(p,i){
  const lbl = !p.in ? "niet geselecteerd" : (p.start ? "basis" : "bank");
  const sty = !p.in ? "background:var(--fill);color:var(--text3)"
            : (p.start ? "background:var(--tint-soft);color:var(--tint)" : "background:var(--bench-soft);color:var(--bench)");
  return '<div class="row" data-idx="'+i+'">'+
    '<button onclick="setupToggle('+i+')" style="flex:0 0 36px;height:36px;border-radius:10px;font-weight:700;font-size:16px;'+
      (p.in?'background:var(--tint);color:#fff':'background:var(--fill);color:var(--text2)')+'">'+esc(p.n)+'</button>'+
    '<input type="text" value="'+esc(p.f)+'" placeholder="voornaam" style="text-align:left;min-width:40px" oninput="setupName('+i+',this.value)" autocomplete="off">'+
    '<button onclick="setupRole('+i+')" style="flex:0 0 auto;font-size:12.5px;font-weight:600;padding:7px 9px;border-radius:9px;white-space:nowrap;'+sty+'">'+lbl+'</button></div>';
}
function refreshSetupFooter(){
  const st = setupState;
  const chosen = st.squad.filter(p=>p.in).length, starters = st.squad.filter(p=>p.in&&p.start).length;
  const c = $("#cnt"); if(c) c.textContent = chosen + " aanwezig · " + starters + " van de " + st.onField + " in de basis";
  const ok = chosen >= st.onField && starters === st.onField;
  const w = $("#goWrap");
  if(w) w.innerHTML = '<button class="btn" '+(ok?"":"disabled")+' onclick="startMatch()">Wedstrijd aanmaken</button>'+
    (ok?"":'<p class="muted" style="text-align:center;padding-top:10px">Duid '+st.onField+' basisspelers aan om te kunnen starten.</p>');
}
function stepper(k,v,step,min,max){
  return '<div class="stepper"><button onclick="setupStep(\''+k+'\',-'+step+','+min+','+max+')">−</button><span class="num">'+v+'</span>'+
         '<button onclick="setupStep(\''+k+'\','+step+','+min+','+max+')">+</button></div>';
}
function setupStep(k,d,min,max){ setupState[k] = Math.min(max, Math.max(min, setupState[k]+d)); renderSetup(); }
function setupSet(k,v){ setupState[k] = v; renderSetup(); }
function starterCount(){ return setupState.squad.filter(x=>x.in && x.start).length; }
function autoRole(p){ p.start = starterCount() < setupState.onField; }
function setupToggle(i){
  const p = setupState.squad[i];
  p.in = !p.in;
  if(p.in) autoRole(p); else p.start = false;
  redrawSquadRow(i);
}
function setupRole(i){
  const p = setupState.squad[i];
  if(!p.in){ p.in = true; autoRole(p); redrawSquadRow(i); return; }
  if(!p.start && starterCount() >= setupState.onField){ toast("Al " + setupState.onField + " basisspelers gekozen"); return; }
  p.start = !p.start;
  redrawSquadRow(i);
}
function redrawSquadRow(i){
  const row = document.querySelector('#squadList .row[data-idx="'+i+'"]');
  if(row){ row.outerHTML = squadRowHTML(setupState.squad[i], i); }
  refreshSetupFooter();
}
function setupName(i,v){ setupState.squad[i].f = v; }
function setupAdd(){
  const el = $("#newNr"), n = (el.value||"").trim();
  if(!n){ el.focus(); return; }
  if(setupState.squad.some(p=>String(p.n)===n)){ toast("Nummer " + n + " staat er al"); el.value = ""; el.focus(); return; }
  const se = season(), r = se.roster[n] || {};
  const np = { n, f:r.f||"", l:r.l||"", in:true, start:false };
  setupState.squad.push(np);
  autoRole(np);
  const i = setupState.squad.length - 1;
  $("#addRow").insertAdjacentHTML("beforebegin", squadRowHTML(setupState.squad[i], i));
  el.value = ""; el.focus();
  refreshSetupFooter();
}
function startMatch(force){
  const se = season(), st = setupState;
  const skip = force === true ? { dup:1, opp:1 } : (force || {});
  if(!skip.dup){
    const same = se.matches.filter(m=> m.date === st.date);
    if(same.length) return confirmDuplicate(se, same);
  }
  if(!skip.opp && !(st.opponent||"").trim()){
    openModal("Geen tegenstander",
      '<p class="muted">Je hebt geen tegenstander ingevuld. Die kan je later nog aanvullen, maar nu is het makkelijker.</p>'+
      '<div class="card"><div class="row"><label class="lbl" for="oppQ">Tegenstander</label><input type="text" id="oppQ" placeholder="clubnaam" autocomplete="off"></div></div>'+
      '<div class="pad"><button class="btn" id="oppGo">Wedstrijd aanmaken</button></div>'+
      '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal(true);startMatch({dup:1,opp:1})">Zonder tegenstander verder</button></div>',
      { onMount(mo){
          const el = mo.querySelector("#oppQ");
          const fire = ()=>{ const v = el.value.trim(); if(!v){ el.focus(); return; } st.opponent = v; closeModal(true); startMatch({ dup:1, opp:1 }); };
          mo.querySelector("#oppGo").onclick = fire;
          el.addEventListener("keydown", e=>{ if(e.key === "Enter") fire(); });
          setTimeout(()=>{ try{ el.focus(); }catch(e){} }, 220);
        }});
    return;
  }
  const squad = st.squad.filter(p=>p.in).map(p=>({ n:p.n, f:(p.f||"").trim(), l:(p.l||"").trim(), start:p.start }));
  squad.forEach(p=>{ se.roster[p.n] = { f:p.f, l:p.l || ((se.roster[p.n]||{}).l || "") }; });
  const m = newMatch(se, { date:st.date, opponent:(st.opponent||"").trim(), venue:st.venue,
    parts:st.parts, partMin:st.partMin, onField:st.onField, squad });
  logEv(m, "Wedstrijdblad klaar — " + squad.length + " spelers");
  S.openMatch = m.id; setupState = null; save(true); go("match");
}

/* ---------- wedstrijdscherm ---------- */
function renderMatch(){
  const m = match(), se = season();
  if(!m) return go("season");
  if(m.status !== "live") return go("summary");
  const us = usName(se), them = m.opponent || "Tegenstander";
  const left = m.venue==="home" ? us : them, right = m.venue==="home" ? them : us;

        '<span class="goalbub num" data-g="'+esc(p.n)+'" '+(p.goals?'':'hidden')+'>'+(p.goals||0)+'</span></span>'+
      '<span class="info"><span class="nm">'+esc(dispName(p))+'</span>'+
        '<span class="tm num"><b data-f="'+esc(p.n)+'">0:00</b><span class="bb" data-b="'+esc(p.n)+'">0:00</span></span>'+
        '<span class="now num" data-now="'+esc(p.n)+'" hidden></span></span>'+

  }
  dock.innerHTML =

    '<button class="act" onclick="cardSheet()">'+svg.card+'<span>Kaart</span></button>'+
    '<button class="act" onclick="moreSheet()">'+svg.more+'<span>Meer</span></button>';
