}

function paint(){
  if(!READY) return;
  const m = match(); if(!m || VIEW !== "match") return;
  const T = elapsedTotal(m), c = m.clock, partMs = elapsedPart(m,c.part), limit = m.cfg.partMin*60000;
  const clk = $("#clk");
  if(!clk) return;
  const over = partMs >= limit;
  clk.textContent = over ? "+" + mmss(partMs - limit) : mmssUp(limit - partMs);
  clk.className = "clock num" + (over ? " over" : (c.running ? "" : " idle"));
  $("#clksub").textContent = ordinalPart(c.part, m.cfg.parts) + " · gespeeld " + mmss(T);
  $("#clkpill").innerHTML = c.running ? '<span class="pill live">'+(over?"extra tijd":"loopt")+'</span>'
    : '<span class="pill '+(partMs?"paused":"")+'">'+(partMs ? (over?"tijd om":"stil") : "klaar om te starten")+'</span>';

  // het moment waarop de reguliere tijd voorbij is, één keer loggen
  /* enkel iets aanpassen als er echt gelogd wordt: anders lijkt de wedstrijd op dit toestel
     'gewijzigd' en worden wijzigingen van andere toestellen niet overgenomen */
  const C = canControl(m);
  if(C && over && !(Array.isArray(c.otLog) && c.otLog[c.part])){
    if(!Array.isArray(c.otLog)) c.otLog = [];
    c.otLog[c.part] = true;
    m.log.push({ t: prevPartsMs(m, c.part) + limit, part: c.part, wall: Date.now(),
      text: "Reguliere tijd " + ordinalPart(c.part, m.cfg.parts).toLowerCase() + " voorbij — extra tijd loopt" });
    save();
  }

  let fired = null;
  playersArr(m).forEach(p=>{
    if(C && p.status === "susp" && p.susp && T >= p.susp.until){
      const until = p.susp.until;
      commit(m,p,until); p.status = "field"; p.since = until; p.ready = true; p.susp = null;
      logEv(m, p.n + " " + dispName(p) + " straf afgelopen — terug het veld in");
      fired = p;
    }
    if(C && p.ready && p.status === "field" && T - p.since > 12000) p.ready = false;
    const L = liveOf(p,T), q = s=> document.querySelector('['+s+'="'+CSS.escape(String(p.n))+'"]');
    const f = q("data-f"), b = q("data-b"), now = q("data-now"), sc = q("data-s"), gb = q("data-g");
    if(f) f.textContent = mmss(L.field);
    if(b) b.textContent = mmss(L.bench);
    if(sc) sc.textContent = p.subs;
    if(gb){ gb.hidden = !p.goals; gb.textContent = p.goals || 0; }
    if(now){
      if(p.status === "bench"){ now.hidden = false; now.className = "now num"; now.textContent = "nu " + mmss(L.spell); }
      else if(p.status === "susp" && p.susp){ now.hidden = false; now.className = "now num sus"; now.textContent = "straf " + mmss(Math.max(0, p.susp.until - T)); }
      else now.hidden = true;
    }
    const card = document.querySelector('.pl[data-p="'+CSS.escape(String(p.n))+'"]');
    if(card){
      const want = "pl " + p.status + (p.status==="susp" && p.susp ? " c-"+p.susp.type : "") + (p.ready && p.status==="field" ? " ready" : "");
      if(card.className !== want) card.className = want;
    }
  });
  if(fired){ save(true); alarm(); toast("Straf afgelopen — " + fired.n + " " + dispName(fired) + " staat weer op het veld", 4600); }

  const strip = $("#strip");
  const bench = benchByWait(m);
  const susp  = suspBySoonest(m);
  const sig = susp.map(p=>p.n+p.susp.type).join()+"|"+bench.map(p=>p.n).join();
  if(strip.dataset.sig !== sig){
    strip.dataset.sig = sig;
    let sh = "";
    if(susp.length){
      sh += '<h6>Straftijd</h6><div class="chips">' + susp.map(p=>
        '<button class="chip sus c-'+p.susp.type+'" onclick="playerSheet(\''+esc(p.n)+'\')"><b class="num">'+esc(p.n)+'</b><span class="tt">0:00</span></button>').join("") + '</div>';
    }
    sh += '<h6>Bank — ' + bench.length + (bench.length > 1 ? ' · langst eerst' : '') + '</h6><div class="chips">';
    sh += bench.length ? bench.map((p,i)=>
      '<button class="chip bench'+(i===0 && bench.length>1?" next":"")+'" onclick="playerSheet(\''+esc(p.n)+'\')"><b class="num">'+esc(p.n)+'</b><span class="tt">0:00</span></button>').join("")
      : '<span class="chip-empty">Niemand op de bank.</span>';
    sh += '</div>';
    strip.innerHTML = sh;
  }
  const chips = strip.querySelectorAll(".chip");
  let i = 0;
  susp.forEach(p=>{ const el = chips[i++]; if(el) el.querySelector(".tt").textContent = mmss(Math.max(0, p.susp.until - T)); });
  bench.forEach(p=>{ const el = chips[i++]; if(el) el.querySelector(".tt").textContent = mmss(liveOf(p,T).spell); });
  document.querySelectorAll("[data-sc]").forEach(el=>{ el.textContent = m.score[el.dataset.sc]; });
  const vb = document.getElementById("vbSub");
  if(vb && m.ctrl){
    const age = beatAge(m);
    vb.textContent = "bediend door " + (m.ctrl.name || "een ander toestel") + (age > 150000 ? " · geen teken sinds " + Math.round(age / 60000) + " min" : "");
    vb.style.color = age > 150000 ? "var(--danger)" : "";
  }
}

/* ---------- speler ---------- */
function playerSheet(n){
  const m = match(), p = m.players[n], T = elapsedTotal(m), L = liveOf(p,T);
  const VIEWONLY = isViewer(m);
  let h = '<div class="card" style="margin-bottom:14px">';
  if(VIEWONLY) h += '<div class="row"><div class="grow"><div class="t">'+esc(fullName(p) || dispName(p))+'</div></div></div>';
  else h += '<button class="row" onclick="nameSheet(\''+esc(p.n)+'\')"><div class="grow"><div class="t">'+esc(fullName(p) || "naam toevoegen")+'</div></div><span style="color:var(--tint)">'+svg.pen+'</span></button>';
  h += '<div class="row"><div class="grow"><div class="t">Op het veld</div></div><div class="v num" style="color:var(--tint);font-weight:600">'+mmss(L.field)+'</div></div>';
  h += '<div class="row"><div class="grow"><div class="t">Op de bank</div>'+(p.status==="bench"?'<div class="s">deze beurt '+mmss(L.spell)+'</div>':'')+
       '</div><div class="v num" style="color:var(--bench);font-weight:600">'+mmss(L.bench)+'</div></div>';
  h += '<div class="row"><div class="grow"><div class="t">Keer gewisseld</div></div><div class="v num">'+p.subs+'</div></div>';
  if(p.goals) h += '<div class="row"><div class="grow"><div class="t">Doelpunten</div></div><div class="v num">'+p.goals+'</div></div>';
  if(p.cards.length) h += '<div class="row"><div class="grow"><div class="t">Kaarten</div></div><div class="v">'+p.cards.map(c=>CARD_DEF[c.type].label.split(" ")[0]).join(", ")+'</div></div>';
  h += '</div>';
  if(VIEWONLY){ openModal(p.n + (fullName(p) ? " · " + dispName(p) : ""), h + '<div style="height:10px"></div>'); return; }

  if(p.status === "field"){
    const bench = benchByWait(m);
    h += '<div class="sec">Vervangen door</div><div class="card">';
    if(!bench.length) h += '<div class="row"><div class="s">Niemand beschikbaar op de bank.</div></div>';
    bench.forEach(b=>{
      const BL = liveOf(b,T);
      h += '<button class="opt" onclick="sub(\''+esc(p.n)+'\',\''+esc(b.n)+'\');closeModal()"><span class="badge b num">'+esc(b.n)+'</span>'+
        '<span style="flex:1"><span style="display:block">'+esc(dispName(b))+'</span><span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(BL.spell)+' op de bank</span></span>'+
        '</button>';
    });
    h += '</div>';
  } else if(p.status === "bench"){
    h += '<div class="sec">Brengt wie naar de bank?</div><div class="card">';
    onFieldNow(m).forEach(f=>{
      const FL = liveOf(f,T);
      h += '<button class="opt" onclick="sub(\''+esc(f.n)+'\',\''+esc(p.n)+'\');closeModal()"><span class="badge f num">'+esc(f.n)+'</span>'+
        '<span style="flex:1"><span style="display:block">'+esc(dispName(f))+'</span><span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(FL.field)+' gespeeld</span></span></button>';
    });
    h += '</div>';
  } else if(p.status === "susp"){
    h += '<div class="sec">Straf — nog '+mmss(Math.max(0,p.susp.until-T))+'</div><div class="card">'+
      '<button class="opt" onclick="backFromSusp(\''+esc(p.n)+'\',true)"><span style="flex:1">Straf beëindigen, terug het veld in</span></button>'+
      '<button class="opt" onclick="backFromSusp(\''+esc(p.n)+'\',false)"><span style="flex:1">Straf beëindigen, naar de bank</span></button></div>';
  } else {
    h += '<div class="sec">Rode kaart</div><div class="card"><div class="row"><div class="s">Deze speler doet niet meer mee.</div></div></div>';
  }

  if(p.status !== "out"){
    h += '<div class="sec">Kaart geven</div><div class="card">';
    ["groen","geel","rood"].forEach(t=>{
      const d = CARD_DEF[t];
      h += '<button class="opt" onclick="giveCard(\''+esc(p.n)+'\',\''+t+'\')"><span class="dot '+t+'"></span><span style="flex:1">'+d.label+'</span>'+
        '<span style="color:var(--text2);font-size:14px">'+(d.ms?(d.ms/60000)+" min":"rest van de wedstrijd")+'</span></button>';
    });
    h += '</div>';
  }
  h += '<div style="height:10px"></div>';
  openModal(p.n + (fullName(p) ? " · " + dispName(p) : ""), h);
}
function nameSheet(n){
  if(!ctl()) return;
  const m = match(), p = m.players[n];
  openModal("Naam van nummer " + p.n,
    '<div class="card"><div class="row"><label class="lbl" for="nf">Voornaam</label><input type="text" id="nf" value="'+esc(p.f)+'" placeholder="Anneliese" autocomplete="off"></div>'+
    '<div class="row"><label class="lbl" for="nl">Achternaam</label><input type="text" id="nl" value="'+esc(p.l)+'" placeholder="optioneel" autocomplete="off"></div></div>'+
    '<p class="muted">Op de spelerkaart staat enkel de voornaam.</p>'+
    '<div class="pad"><button class="btn" id="nGo">Bewaren</button></div>',
    { onMount(mo){
        const f = mo.querySelector("#nf"), l = mo.querySelector("#nl");

        mo.querySelector("#nGo").onclick = fire;

/* ---------- wisselen in twee stappen ---------- */
let subOff = null;
function subSheet(){ if(!ctl()) return; subOff = null; drawSubSheet(); }
function drawSubSheet(){
  const m = match(), T = elapsedTotal(m);
  if(!subOff){
    const field = onFieldNow(m);
    if(!benchByWait(m).length){ toast("Niemand op de bank"); return; }
    let h = '<p class="muted">Stap 1 van 2 — wie gaat van het veld?</p><div class="card">';
    field.forEach(f=>{
      const L = liveOf(f,T);
      h += '<button class="opt" onclick="pickOff(\''+esc(f.n)+'\')"><span class="badge f num">'+esc(f.n)+'</span>'+
        '<span style="flex:1"><span style="display:block">'+esc(dispName(f))+'</span>'+
        '<span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(L.field)+' gespeeld · '+f.subs+' wissels</span></span>'+
        '<span class="chev">'+svg.chev+'</span></button>';
    });
    h += '</div><div style="height:12px"></div>';
    openModal("Wissel", h);
  }else{
    const p = m.players[subOff];
    const bench = benchByWait(m);
    let h = '<p class="muted">Stap 2 van 2 — wie komt erin voor '+esc(p.n)+' '+esc(dispName(p))+'?</p><div class="card">';
    bench.forEach(b=>{
      const L = liveOf(b,T);
      h += '<button class="opt" onclick="doSub(\''+esc(b.n)+'\')"><span class="badge b num">'+esc(b.n)+'</span>'+
        '<span style="flex:1"><span style="display:block">'+esc(dispName(b))+'</span>'+
        '<span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(L.spell)+' op de bank · totaal '+mmss(L.bench)+'</span></span>'+
        '</button>';
    });
    h += '</div><div class="pad"><button class="btn ghost" onclick="subSheet()">Terug</button></div>';
    openModal("Wissel", h);
  }
}
function pickOff(n){ subOff = n; drawSubSheet(); }
function doSub(inN){ const off = subOff; subOff = null; closeModal(); sub(off, inN); }

function cardSheet(){
  if(!ctl()) return;
  const m = match();
  const cands = playersArr(m).filter(p=>p.status==="field" || p.status==="bench");
  let h = '<p class="muted">Kies de speler, daarna de kaart.</p><div class="card">';
  cands.forEach(p=>{
    h += '<button class="opt" onclick="playerSheet(\''+esc(p.n)+'\')"><span class="badge '+(p.status==="field"?"f":"b")+' num">'+esc(p.n)+'</span>'+
      '<span style="flex:1">'+esc(dispName(p))+'</span><span style="font-size:13px;color:var(--text2)">'+(p.status==="field"?"veld":"bank")+'</span></button>';
  });
  h += '</div><div style="height:12px"></div>';
  openModal("Kaart geven", h);
}
function goalSheet(side){
  if(!ctl()) return;

    h += '<div class="sec">Wie scoorde?</div><div class="card">';

      h += '<button class="opt" onclick="goal(\'us\',\''+esc(p.n)+'\')"><span class="badge f num">'+esc(p.n)+'</span>'+
        '<span style="flex:1">'+esc(dispName(p))+'</span>'+(p.goals?'<span class="num" style="color:var(--cg);font-weight:700">'+p.goals+'</span>':'')+'</button>';

function moreSheet(){
  if(!ctl()) return;
  const m = match(), part = ordinalPart(m.clock.part, m.cfg.parts).toLowerCase();
  let h = '<div class="sec">Selectie</div><div class="card">';

       '<span style="color:var(--text2);font-size:14px">komt op de bank</span></button>';

  h += '<div class="sec">Klok bijstellen</div><div class="card">';
  h += '<button class="opt" onclick="nudgeClock(60000);closeModal()"><span style="flex:1">Eén minuut bijtellen</span><span style="color:var(--text2);font-size:14px">te laat gestart</span></button>';
  h += '<button class="opt" onclick="nudgeClock(-60000);closeModal()"><span style="flex:1">Eén minuut aftrekken</span><span style="color:var(--text2);font-size:14px">te vroeg gestart</span></button>';
  h += '<button class="opt" onclick="nudgeClock(10000);closeModal()"><span style="flex:1">Tien seconden bijtellen</span></button>';
  h += '<button class="opt" onclick="nudgeClock(-10000);closeModal()"><span style="flex:1">Tien seconden aftrekken</span></button></div>';
  h += '<div class="sec">Wedstrijd</div><div class="card">';

    h += '<button class="opt" onclick="endPart()"><span style="flex:1">Einde '+part+'</span><span style="color:var(--text2);font-size:14px">volgende deel klaarzetten</span></button>';

    h += '</div>';
  }
  h += '<div class="ver">'+APP_NAME+' '+APP_VERSION+'</div>';
  openModal("Meer", h);
}
function addPlayerSheet(){
  if(!ctl()) return;
  const m = match(), se = season();
  const known = Object.keys(se.roster).filter(n=> !m.players[n]).sort((a,b)=> (+a)-(+b));
  let h = "";
  if(known.length){
    h += '<div class="sec">Uit het spelersbestand</div><div class="card">';
    known.forEach(n=>{
      const r = se.roster[n] || {};
      h += '<button class="opt" onclick="addLatePlayer(\''+esc(n)+'\')"><span class="badge b num">'+esc(n)+'</span>'+
           '<span style="flex:1">'+esc(((r.f||"")+" "+(r.l||"")).trim() || "geen naam")+'</span></button>';
    });
    h += '</div>';
  }
  h += '<div class="sec">Nieuw nummer</div><div class="card">'+
    '<div class="row"><label class="lbl" for="apN">Rugnummer</label><input type="tel" inputmode="numeric" id="apN" autocomplete="off"></div>'+
    '<div class="row"><label class="lbl" for="apF">Voornaam</label><input type="text" id="apF" placeholder="optioneel" autocomplete="off"></div>'+
    '<div class="row"><label class="lbl" for="apL">Achternaam</label><input type="text" id="apL" placeholder="optioneel" autocomplete="off"></div></div>'+
    '<p class="muted">De speler komt op de bank. De banktijd telt vanaf nu, niet vanaf de aftrap.</p>'+
    '<div class="pad"><button class="btn" id="apGo">Toevoegen</button></div>';
  openModal("Speler toevoegen", h, { onMount(mo){
    const nEl = mo.querySelector("#apN"), fEl = mo.querySelector("#apF"), lEl = mo.querySelector("#apL");
    const fire = ()=>{
      const n = nEl.value.trim();
      if(!n){ nEl.focus(); toast("Geef een rugnummer"); return; }
      addLatePlayer(n, fEl.value, lEl.value);
    };
    mo.querySelector("#apGo").onclick = fire;
    [nEl,fEl,lEl].forEach(el=> el.addEventListener("keydown", e=>{ if(e.key==="Enter") fire(); }));
    nEl.addEventListener("input", ()=>{
      const r = se.roster[nEl.value.trim()];
      if(r){ if(!fEl.value) fEl.value = r.f||""; if(!lEl.value) lEl.value = r.l||""; }
    });
  }});
}
function removePlayerSheet(){
  if(!ctl()) return;
  const m = match(), T = elapsedTotal(m);
  const where = { field:"op het veld", bench:"op de bank", susp:"straftijd", out:"uit de wedstrijd" };
  let h = '<p class="muted">Kies wie uit deze wedstrijd moet. In het spelersbestand van het seizoen blijft de speler gewoon staan.</p><div class="card">';
  playersArr(m).forEach(p=>{
    const L = liveOf(p,T);
    h += '<button class="opt" onclick="confirmRemove(\''+esc(p.n)+'\')"><span class="badge '+(p.status==="field"?"f":"b")+' num">'+esc(p.n)+'</span>'+
         '<span style="flex:1"><span style="display:block">'+esc(dispName(p))+'</span>'+
         '<span style="display:block;font-size:13px;color:var(--text2)" class="num">'+where[p.status]+' · '+mmss(L.field)+' gespeeld</span></span></button>';
  });
  h += '</div><div style="height:12px"></div>';
  openModal("Speler verwijderen", h);
}
function confirmRemove(n){
  const m = match(), p = m.players[n]; if(!p) return;
  const L = liveOf(p, elapsedTotal(m));
  const hasData = L.field >= 1000 || p.subs > 0 || p.goals > 0 || p.cards.length > 0;
  let txt = esc(p.n + " " + dispName(p)) + ' verdwijnt uit deze wedstrijd.';
  if(hasData) txt += ' Ook de tijden, wissels'+(p.goals?', doelpunten':'')+(p.cards.length?' en kaarten':'')+' van deze speler in deze wedstrijd worden gewist. De stand blijft wel staan.';
  if(p.status === "field") txt += ' Je staat daarna met één speler minder op het veld.';
  openModal("Speler verwijderen",
    '<p class="muted">'+txt+'</p>'+
    '<div class="pad"><button class="btn dngr" onclick="doRemove(\''+esc(n)+'\')">Verwijderen</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal()">Annuleren</button></div>');
}
function doRemove(n){
  if(!ctl()) return;
  const m = match(), p = m.players[n]; if(!p) return;
  const label = p.n + " " + dispName(p);
  delete m.players[n];
  logEv(m, label + " verwijderd uit de selectie");
  save(true); closeModal(); renderMatch();
  toast(label + " verwijderd");
}
function addLatePlayer(n, f, l){
  if(!ctl()) return;
  const m = match(), se = season();
  n = String(n).trim(); if(!n) return;
  if(m.players[n]){ toast("Nummer " + n + " speelt al mee"); return; }
  const r = se.roster[n] || {};
  f = String(f||"").trim() || r.f || "";
  l = String(l||"").trim() || r.l || "";
  const T = elapsedTotal(m);
  m.players[n] = { n, f, l, status:"bench", fieldMs:0, benchMs:0, suspMs:0, subs:0,
                   since:T, longestBench:0, cards:[], susp:null, ready:false, goals:0 };
  se.roster[n] = { f, l };
  logEv(m, n + " " + dispName(m.players[n]) + " toegevoegd aan de selectie");
  save(true); closeModal(); renderMatch();
  toast(n + " " + dispName(m.players[n]) + " staat op de bank");
}
function confirmFinish(){
  if(!ctl()) return;
  const m = match();
  openModal("Wedstrijd beëindigen",
    '<p class="muted">De klok stopt en alle tijden worden vastgezet.</p>'+
    '<div class="pad"><button class="btn dngr" onclick="finishMatch()">Beëindigen op '+m.score.us+'–'+m.score.them+'</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal()">Toch niet</button></div>');
}

/* ---------- overzicht ---------- */
function renderSummary(){
  const m = match(), se = season();
  if(!m) return go("season");
  nav(backBtn("season") + navTitle(usName(se) + " – " + (m.opponent||"?"), dateNL(m.date), "editMatchNames()") + '<div style="width:44px"></div>');

  let h = '<div class="pad" style="text-align:center;padding-bottom:6px">'+
    '<div class="num" style="font-size:44px;font-weight:700;letter-spacing:-.03em">'+m.score.us+'–'+m.score.them+'</div>'+
    '<div style="color:var(--text2);font-size:14px">'+(m.venue==="home"?"thuis":"uit")+' · '+hmm(T)+' effectieve speeltijd</div></div>';

    h += '<div class="card" style="margin-top:8px"><button class="row" onclick="editMatchNames()"><div class="grow"><div class="t" style="color:var(--tint)">Tegenstander invullen</div>'+

  ps.forEach(p=>{
    const L = liveOf(p,T);
    h += '<tr><td><b class="num">'+esc(p.n)+'</b> '+esc(dispName(p))+'</td>'+
      '<td class="num" style="color:var(--tint);font-weight:600">'+mmss(L.field)+'</td>'+
      '<td class="num" style="color:var(--bench)">'+mmss(L.bench)+'</td>'+
      '<td class="num">'+p.subs+'</td><td class="num">'+(p.goals||"")+'</td></tr>';
  });
  h += '</tbody></table></div><p class="muted">W = wissels, D = doelpunten.</p>';
  const lb = ps.map(p=>({ n:p.n, v:Math.max(p.longestBench, p.status==="bench"?liveOf(p,T).spell:0) })).sort((a,b)=>b.v-a.v)[0];
  if(lb && lb.v) h += '<p class="muted">Langste ononderbroken bankbeurt: '+esc(lb.n)+' met '+mmss(lb.v)+'.</p>';

  if(!m.log.length) h += '<div class="row"><div class="s">Niets gelogd.</div></div>';

  m.log.forEach(l=> h += '<div class="logline"><span class="lt num">'+mmss(l.t)+'</span><span>'+esc(l.text)+'</span>'+
    (manyBy && l.by ? '<span class="by">'+esc(l.by)+'</span>' : '')+'</div>');
  h += '</div>';

  h += '<div class="pad"><button class="btn ghost" onclick="shareMatch()">Overzicht delen</button></div>';
  h += '<div class="pad" style="padding-top:0"><button class="btn ghost" style="color:var(--danger)" onclick="askDelMatch(\''+m.id+'\')">Wedstrijd verwijderen</button></div>';
  $("#view").innerHTML = h;
}
function matchText(){
  const m = match(), se = season(), T = m.totalMs != null ? m.totalMs : elapsedTotal(m);
  let t = teamLabel(se) + " – " + (m.opponent||"?") + "  " + m.score.us + "–" + m.score.them + "\n" + dateNL(m.date) + "\n\n";
  playersArr(m).forEach(p=>{ const L = liveOf(p,T);
    t += p.n + " " + dispName(p) + " — veld " + mmss(L.field) + ", bank " + mmss(L.bench) + ", " + p.subs + " wissels" + (p.goals?", "+p.goals+" doelpunt"+(p.goals>1?"en":""):"") + "\n"; });
  return t;
}
async function shareMatch(){
  const txt = matchText();
  try{
    if(navigator.share){ await navigator.share({ title:"Wedstrijdoverzicht", text:txt }); return; }
    await navigator.clipboard.writeText(txt); toast("Gekopieerd");
  }catch(e){
    openModal("Overzicht", '<div class="pad"><textarea class="ta" readonly>'+esc(txt)+'</textarea></div>');
  }
}

/* ---------- seizoenstotalen ---------- */
function renderSeasonStats(){
  const se = season(); if(!se) return go("home");
  nav(backBtn("season") + navTitle("Seizoenstotalen", teamLabel(se) + " · " + se.name) + '<div style="width:44px"></div>');
  const agg = {};
  se.matches.forEach(m=>{
    const T = m.totalMs != null ? m.totalMs : elapsedTotal(m);
    playersArr(m).forEach(p=>{
      const L = liveOf(p,T);
      const a = agg[p.n] || (agg[p.n] = { n:p.n, f:p.f || (se.roster[p.n]||{}).f || "", app:0, field:0, bench:0, subs:0, goals:0 });
      if(p.f) a.f = p.f;
      a.app++; a.field += L.field; a.bench += L.bench; a.subs += p.subs; a.goals += (p.goals||0);
    });
  });
  const rows = Object.values(agg).sort((a,b)=>(+a.n)-(+b.n));
  let h = '<p class="muted">Over '+se.matches.length+' wedstrijd'+(se.matches.length===1?"":"en")+'. Lopende wedstrijden tellen mee met hun stand van nu.</p>';
  if(!rows.length) h += '<div class="empty">Nog geen gegevens.</div>';
  else{
    h += '<div class="card"><table class="st"><thead><tr><th>Speler</th><th>W</th><th>Veld</th><th>Bank</th><th>D</th></tr></thead><tbody>';
    rows.forEach(a=> h += '<tr><td><b class="num">'+esc(a.n)+'</b> '+esc(a.f)+'</td><td class="num">'+a.app+'</td>'+
      '<td class="num" style="color:var(--tint);font-weight:600">'+hmm(a.field)+'</td>'+
      '<td class="num" style="color:var(--bench)">'+hmm(a.bench)+'</td><td class="num">'+(a.goals||"")+'</td></tr>');
    h += '</tbody></table></div><p class="muted">W = wedstrijden, D = doelpunten.</p>';
  }
  $("#view").innerHTML = h;
}

function rosterNums(se){ return Object.keys(se.roster||{}).sort((a,b)=> ((+a)-(+b)) || String(a).localeCompare(String(b))); }
function renderRoster(){
  const se = season(); if(!se) return go("home");
  nav(backBtn("season") + navTitle("Spelers", teamLabel(se) + " · " + se.name) + '<div style="width:44px"></div>');
  const ns = rosterNums(se);
  let h = '<div class="pad"><button class="btn" onclick="rosterEdit()">Speler toevoegen</button></div>';
  if(!ns.length){
    h += '<div class="empty">Nog geen spelers. Voeg ze hier toe met hun rugnummer, dan staan ze klaar bij elke nieuwe wedstrijd.</div>';
  }else{
    h += '<div class="sec">'+ns.length+' speler'+(ns.length===1?"":"s")+'</div><div class="card">';
    ns.forEach(n=>{
      const r = se.roster[n] || {};
      const nm = ((r.f||"") + " " + (r.l||"")).trim();
      h += '<button class="row" onclick="rosterEdit(\''+esc(n)+'\')">'+
        '<span class="num" style="flex:0 0 36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--tint);color:#fff;font-weight:700">'+esc(n)+'</span>'+
        '<div class="grow"><div class="t"'+(nm?'':' style="color:var(--text3)"')+'>'+esc(nm || "geen naam")+'</div></div><span class="chev">'+svg.chev+'</span></button>';
    });
    h += '</div>';
  }
  h += '<p class="muted" style="margin-top:12px">Deze spelers staan klaar bij elke nieuwe wedstrijd van dit team. Alle leden van het team zien dezelfde lijst.</p>';
  $("#view").innerHTML = h;
}
function rosterEdit(n){
  const se = season(); if(!se) return;
  const isNew = n === undefined, r = isNew ? {} : (se.roster[n] || {});
  openModal(isNew ? "Speler toevoegen" : "Speler " + n,
    '<div class="card"><div class="row"><label class="lbl" for="rN">Rugnummer</label><input type="tel" inputmode="numeric" id="rN" value="'+esc(isNew?"":n)+'" autocomplete="off"></div>'+
    '<div class="row"><label class="lbl" for="rF">Voornaam</label><input type="text" id="rF" value="'+esc(r.f||"")+'" autocomplete="off"></div>'+
    '<div class="row"><label class="lbl" for="rL">Achternaam</label><input type="text" id="rL" value="'+esc(r.l||"")+'" placeholder="optioneel" autocomplete="off"></div></div>'+
    (isNew ? '' : '<p class="muted">Verander je het rugnummer, dan behouden gespeelde wedstrijden het oude nummer.</p>')+
    '<div class="pad"><button class="btn" id="rGo">'+(isNew ? "Toevoegen" : "Bewaren")+'</button></div>'+
    (isNew ? '<div class="pad" style="padding-top:0"><button class="btn ghost" id="rMore">Toevoegen en nog een</button></div>'
           : '<div class="pad" style="padding-top:0"><button class="btn ghost" style="color:var(--danger)" id="rDel">Uit de spelerslijst halen</button></div>'),
    { onMount(mo){
        const nEl = mo.querySelector("#rN"), fEl = mo.querySelector("#rF"), lEl = mo.querySelector("#rL");
        const fire = again=>{
          const nn = nEl.value.trim().replace(/\s+/g, "");
          if(!nn){ nEl.focus(); toast("Geef een rugnummer"); return; }
          if(nn !== n && se.roster[nn]){ nEl.focus(); toast("Nummer " + nn + " is al van " + (((se.roster[nn].f||"") + " " + (se.roster[nn].l||"")).trim() || "iemand anders")); return; }
          if(!isNew && nn !== n) delete se.roster[n];
          se.roster[nn] = { f:fEl.value.trim(), l:lEl.value.trim() };
          save(true);
          if(again){ closeModal(true); rosterEdit(); toast("Nummer " + nn + " toegevoegd"); }
          else { closeModal(); }
          if(VIEW === "roster") renderRoster();
        };
        mo.querySelector("#rGo").onclick = ()=> fire(false);
        const more = mo.querySelector("#rMore"); if(more) more.onclick = ()=> fire(true);
        const del = mo.querySelector("#rDel");
        if(del) del.onclick = ()=>{ delete se.roster[n]; save(true); closeModal(); if(VIEW === "roster") renderRoster(); toast("Nummer " + n + " uit de lijst gehaald"); };
        [nEl,fEl,lEl].forEach(el=> el.addEventListener("keydown", e=>{ if(e.key === "Enter") fire(isNew); }));
        setTimeout(()=>{ try{ (isNew ? nEl : fEl).focus(); }catch(e){} }, 220);
      }});
}

/* ---------- leden, codes en lid worden ---------- */
const CODE_WORDS = ["UMPIRE","STICK","BALL","CORNER","GOAL","KEEPER","PUSH","FLICK","SLAP","HIT","SCOOP","PASS","TACKLE","CIRCLE",
  "BACKHAND","REVERSE","TOMAHAWK","AERIAL","SHOOTOUT","STROKE","PENALTY","CARD","WHISTLE","SAVE","SCORE","ASSIST","TURF","PITCH",
  "BENCH","COACH","CAPTAIN","TEAM","CLUB","GRIP","TAPE","HOOK","KICKBACK","HALFTIME","DRIBBLE","DRAG"];
const DAY_MS = 24 * 3600 * 1000;
function timeNL(ms){ const d = new Date(ms); return d.toLocaleTimeString("nl-BE", { hour:"2-digit", minute:"2-digit" }); }
function dayTimeNL(ms){
  const d = new Date(ms), today = new Date();
  const same = d.toDateString() === today.toDateString();
  return (same ? "vandaag" : "morgen") + " om " + timeNL(ms);
}
function openInvites(se){ return ((se && se.invites) || []).filter(x=> x && x.code && x.until > Date.now()); }
function inviteUrl(code){ return location.origin + location.pathname + "?code=" + encodeURIComponent(code); }

/* uitnodigingen die gebruikt of verlopen zijn, uit de lijst halen */
let tidyBusy = false;
async function tidyInvites(se){
  if(tidyBusy || !navigator.onLine || !window.FB) return;
  const list = (se.invites||[]).slice(); if(!list.length) return;
  tidyBusy = true;
  try{
    const F = window.FB, keep = [];
    for(const x of list){
      if(!x || !x.code || x.until <= Date.now()) continue;
      try{
        const d = await F.getDoc(F.doc(F.db, "invites", x.code));
        if(d.exists() && !d.data().used && d.data().teamId === se.id) keep.push(x);
      }catch(e){ keep.push(x); }
    }
    if(keep.length !== list.length){
      se.invites = keep; save(true);
      if(VIEW === "members" && season() === se) renderMembers();
    }
  }finally{ tidyBusy = false; }
}
async function makeInvite(se){
  const F = window.FB;
  for(let tries = 0; tries < 8; tries++){
    const code = CODE_WORDS[Math.floor(Math.random() * CODE_WORDS.length)] + "-" + (10 + Math.floor(Math.random() * 90));
    if(openInvites(se).some(x=> x.code === code)) continue;
    try{
      const ex = await F.getDoc(F.doc(F.db, "invites", code));
      if(ex.exists()) continue;
    }catch(e){ console.warn(e); return null; }
    const b = F.writeBatch(F.db);
    b.set(F.doc(F.db, "invites", code), { teamId:se.id, createdBy:USER.uid, createdByName:userShort(),
      label:teamLabel(se), season:se.name||"", created:F.serverTimestamp(), used:false, usedBy:null });
    const ok = await trackCommit(b, true);
    if(ok){
      const inv = { code, until: Date.now() + DAY_MS - 60000, by:USER.uid };
      se.invites = openInvites(se).concat([inv]);
      save(true);
      return inv;
    }
  }
  return null;
}
async function inviteFlow(){
  const se = season(); if(!se || !isAdmin(se)) return;
  if(!navigator.onLine || !window.FB){ toast("Hiervoor is internet nodig"); return; }
  const btn = document.getElementById("invBtn"); if(btn){ btn.disabled = true; btn.textContent = "Uitnodiging maken…"; }
  const inv = await makeInvite(se);
  if(VIEW === "members") renderMembers();
  if(!inv){ toast("Uitnodigen lukte niet. Probeer opnieuw.", 3500); return; }
  inviteSheet(inv.code);
}
function inviteText(se, inv){

  return (who ? who + " nodigt je uit" : "Je bent uitgenodigd") + " voor " + teamLabel(se) + " (" + se.name + ") in " + APP_NAME + ".\n\n" +
    "1. Open deze link in Safari of Chrome: " + inviteUrl(inv.code) + "\n" +
    "2. Meld je aan met Google.\n" +
    "3. Tik op \"Lid worden\".\n\n" +
    "Heb je de app al op je beginscherm? Kies daar Team toevoegen → Ik heb een code → " + inv.code + "\n" +
    "Werkt één keer, geldig tot " + dayTimeNL(inv.until) + ".";
}
function inviteSheet(code){
  const se = season(); if(!se) return;
  const inv = openInvites(se).find(x=> x.code === code); if(!inv){ toast("Deze uitnodiging is niet meer geldig"); return; }
  openModal("Uitnodiging",
    '<div class="card"><div class="row" style="flex-direction:column;align-items:center;padding:18px 16px">'+
      '<div class="num" style="font-size:34px;font-weight:700;letter-spacing:.04em">'+esc(inv.code)+'</div>'+
      '<div class="s" style="margin-top:4px">voor één persoon, geldig tot '+esc(dayTimeNL(inv.until))+'</div></div></div>'+
    '<p class="muted">Stuur dit naar de persoon die je wil uitnodigen. Het bericht bevat een link met de code en korte uitleg.</p>'+
    '<div class="pad"><button class="btn" id="shGo">Versturen</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" id="shCopy">Bericht kopiëren</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" style="color:var(--danger)" id="shDel">Uitnodiging intrekken</button></div>',
    { onMount(mo){
        const txt = inviteText(se, inv);
        mo.querySelector("#shGo").onclick = async ()=>{
          try{
            if(navigator.share){ await navigator.share({ text:txt }); return; }
            await navigator.clipboard.writeText(txt); toast("Gekopieerd, plak het in een bericht");
          }catch(e){ if(!(e && e.name === "AbortError")) copyText(txt); }
        };
        mo.querySelector("#shCopy").onclick = ()=> copyText(txt);
        mo.querySelector("#shDel").onclick = ()=> revokeInvite(inv.code);
      }});
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast("Gekopieerd, plak het in een bericht"); }
  catch(e){ openModal("Bericht kopiëren", '<p class="muted">Selecteer alles en kopieer.</p><div class="pad"><textarea class="ta" readonly>'+esc(txt)+'</textarea></div>'); }
}
function revokeInvite(code){
  const se = season(); if(!se) return;
  if(!navigator.onLine || !window.FB){ toast("Hiervoor is internet nodig"); return; }
  const F = window.FB, b = F.writeBatch(F.db);
  b.delete(F.doc(F.db, "invites", code)); trackCommit(b, true);
  se.invites = openInvites(se).filter(x=> x.code !== code); save(true);
  closeModal(); renderMembers(); toast("Uitnodiging ingetrokken");
}

function doRemoveMember(u){

async function doLeave(){
  const se = season(); if(!se) return;

  flush();
  const F = window.FB, b = F.writeBatch(F.db);
  b.update(F.doc(F.db, "teams", se.id), { members:F.arrayRemove(USER.uid), admins:F.arrayRemove(USER.uid),

/* lid worden met een code */
function parseCode(t){
  const s = String(t||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
  const m = s.match(/^([A-Z]{2,})(\d{2})$/);
  return m ? m[1] + "-" + m[2] : null;
}
function joinSheet(msg){
  openModal("Code invoeren",
    '<div class="card"><div class="row"><label class="lbl" for="jCode">Code</label><input type="text" id="jCode" placeholder="bv. STICK-42" autocomplete="off" autocapitalize="characters" spellcheck="false"></div></div>'+
    (msg ? '<p class="muted" style="color:var(--danger)">'+esc(msg)+'</p>' : '')+
    '<p class="muted">'+CODE_HELP+'</p>'+
    '<div class="pad"><button class="btn" id="jGo">Verder</button></div>',
    { onMount(mo){
        const el = mo.querySelector("#jCode");
        const fire = ()=> checkCode(el.value, mo);
        mo.querySelector("#jGo").onclick = fire;
        el.addEventListener("keydown", e=>{ if(e.key === "Enter") fire(); });
        setTimeout(()=>{ try{ el.focus(); }catch(e){} }, 220);
      }});
}
async function checkCode(raw, mo){
  const code = parseCode(raw);
  if(!code) return joinSheet("Een code bestaat uit een hockeywoord en twee cijfers, bv. STICK-42.");
  if(!navigator.onLine || !window.FB) return joinSheet("Om lid te worden is internet nodig.");
  const btn = mo && mo.querySelector("#jGo"); if(btn){ btn.disabled = true; btn.textContent = "Code nakijken…"; }
  const F = window.FB;
  let inv = null;
  try{
    const snap = await F.getDoc(F.doc(F.db, "invites", code));
    inv = snap.exists() ? snap.data() : null;
  }catch(e){ console.warn(e); return joinSheet("De code kon niet nagekeken worden. Probeer opnieuw."); }
  if(!inv) return joinSheet("De code " + code + " bestaat niet (meer). Kijk ze na, of vraag een nieuwe uitnodiging.");
  if(inv.used) return joinSheet("De code " + code + " is al gebruikt. Vraag een nieuwe uitnodiging aan de hoofdgebruiker.");
  const created = tsOf(inv.created);
  if(created && Date.now() > created + DAY_MS + 600000) return joinSheet("De code " + code + " is verlopen. Vraag een nieuwe uitnodiging aan de hoofdgebruiker.");
  if(S.seasons.some(x=> x.id === inv.teamId)){ closeModal(true); openSeason(inv.teamId); toast("Je zit al in dit team"); return; }
  let label = inv.label, seasonTxt = inv.season;
  if(!label){
    try{ const d = await F.getDoc(F.doc(F.db, "directory", inv.teamId)); const x = d.exists() ? d.data() : null;
      if(x){ label = (CLUBS[x.clubId] ? CLUBS[x.clubId].name : x.club) + " – " + x.team; seasonTxt = x.season; } }catch(e){}
  }
  label = label || "dit team";
  openModal("Lid worden",
    '<p class="muted">Je wordt lid van <b>'+esc(label)+'</b>'+(seasonTxt ? ' ('+esc(seasonTxt)+')' : '')+

async function loadTrash(){
  const F = window.FB, out = [];
  if(!navigator.onLine || !F){ TRASH_M = []; if(VIEW === "trash") renderTrash(); return; }
  for(const se of S.seasons){
    try{
      const snap = await F.getDocs(F.collection(F.db, "teams", se.id, "trash"));
      snap.docs.forEach(d=>{ const x = d.data(); if(x.kind === "match") out.push({ teamId:se.id, id:d.id, match:x.match, at:x.at||0, byName:x.byName||"" }); });
    }catch(e){ console.warn("prullenbak", e); }
  }
  out.sort((a,b)=> b.at - a.at);
  TRASH_M = out.filter(x=> daysLeft(x.at) > 0);
  if(VIEW === "trash") renderTrash();
}

async function purgeTeam(id, ui){
  const F = window.FB; if(!F || !navigator.onLine){ if(ui) toast("Hiervoor is internet nodig"); return; }
  try{
    const refs = [];
    for(const sub of ["matches", "trash"]){
      const snap = await F.getDocs(F.collection(F.db, "teams", id, sub));
      snap.docs.forEach(d=> refs.push(F.doc(F.db, "teams", id, sub, d.id)));
    }
    for(let i = 0; i < refs.length; i += 400){ const b = F.writeBatch(F.db); refs.slice(i, i + 400).forEach(r=> b.delete(r)); await trackCommit(b, true); }
    const b = F.writeBatch(F.db); b.delete(F.doc(F.db, "teams", id));
    await trackCommit(b, !ui);
    delete TRASH_T[id];
    if(ui){ closeModal(); renderTrash(); toast("Definitief verwijderd"); }
  }catch(e){ console.warn(e); if(ui) toast("Verwijderen lukte niet"); }
}

function createNextSeason(prev, team, nm, keep){
  if(keep.indexOf(USER.uid) < 0) keep.unshift(USER.uid);

  ppl[USER.uid] = { f:(PROFILE&&PROFILE.first)||"", l:(PROFILE&&PROFILE.last)||"" };
  const admins = keep.filter(u=> u === USER.uid || (prev.admins||[]).indexOf(u) >= 0);
  const s = { id:uid(), clubId:prev.clubId, club:clubName(prev), team, name:nm, created:Date.now(), roster:{}, matches:[],
    members:keep, admins, people:ppl, invites:[], createdBy:USER.uid, prevTeam:prev.id };
  S.seasons.unshift(s); S.activeSeason = s.id; save(true);
  closeModal(true);
  carrySheet(s.id, prev.id);
  toast("Nieuw seizoen " + nm + " aangemaakt");

/* ---------- opslag nakijken: staat alles echt in de cloud? ---------- */
async function storageCheck(){
  closeModal(true);
  openModal("Opslag nakijken", '<div class="gate" style="min-height:0;padding:24px"><p>De cloud wordt nagekeken…</p><div class="spin"></div></div>');
  if(!navigator.onLine || !window.FB){ openModal("Opslag nakijken", '<p class="muted">Hiervoor is internet nodig.</p><div style="height:12px"></div>'); return; }
  flush();
  const F = window.FB, rows = [], redo = [];
  let bad = 0;
  try{
    const u = await F.getDocFromServer(F.doc(F.db, "users", USER.uid));
    rows.push(['Je profiel', u.exists() ? "in de cloud" : "ontbreekt", u.exists()]);
    if(!u.exists()) bad++;
    for(const se of S.seasons){
      const t = await F.getDocFromServer(F.doc(F.db, "teams", se.id));
      const ms = await F.getDocsFromServer(F.collection(F.db, "teams", se.id, "matches"));
      const srv = {}; ms.docs.forEach(d=>{ const c = stripMeta(d.data()); c.id = d.id; srv[d.id] = stable(c); });
      let ok = 0, miss = 0, diff = 0;
      se.matches.forEach(m=>{
        const k = "m/" + se.id + "/" + m.id;
        if(!srv[m.id]){ miss++; redo.push(k); }
        else if(srv[m.id] !== stable(m)){ diff++; redo.push(k); }
        else ok++;
      });
      if(!t.exists()){ redo.push("t/" + se.id); redo.push("d/" + se.id); }
      const good = t.exists() && !miss && !diff;
      if(!good) bad++;
      rows.push([teamLabel(se) + " (" + se.name + ")",
        (t.exists() ? "team in de cloud" : "team ontbreekt") + " · " + ok + " van " + se.matches.length + " wedstrijden gelijk" +
        (miss ? " · " + miss + " ontbreken" : "") + (diff ? " · " + diff + " verschillen" : ""), good]);
    }
  }catch(e){
    console.warn(e);
    openModal("Opslag nakijken", '<p class="muted">Nakijken lukte niet ('+esc((e && e.code) || "fout")+').</p><div style="height:12px"></div>'); return;
  }
  if(!bad){ SYNC.failed = 0; SYNC.lastErr = ""; paintSync(); }
  let h = '<p class="muted">'+(bad ? "Niet alles staat (juist) in de cloud." : "Alles staat in de cloud.")+'</p><div class="card">';
  rows.forEach(r=> h += '<div class="row"><span class="syncdot '+(r[2]?"":"fail")+'"></span><div class="grow"><div class="t" style="font-size:15px;white-space:normal">'+esc(r[0])+'</div>'+
    '<div class="s" style="white-space:normal">'+esc(r[1])+'</div></div></div>');
  h += '</div>';
  if(redo.length) h += '<div class="pad"><button class="btn" id="redo">Opnieuw doorsturen</button></div>';
  h += '<p class="muted">Wedstrijden die op dit moment op een ander toestel gewijzigd worden, kunnen even "verschillen".</p><div style="height:10px"></div>';
  openModal("Opslag nakijken", h, { onMount(mo){
    const r = mo.querySelector("#redo");
    if(r) r.onclick = ()=>{ redo.forEach(k=> delete SYNC.lastSent[k]); SYNC.full = true; SYNC.failed = 0; flush();
      r.disabled = true; r.textContent = "Bezig…"; setTimeout(storageCheck, 2500); };
  }});
}

function markBackup(){ S.lastBackup = new Date().toISOString().slice(0,10); uiSave(); }
function exportBackup(){

  try{
    const blob = new Blob([data], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = backupBlobName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);

async function copyBackup(){

let IMP = null;
function startImport(obj){
  if(!obj){ toast("Geen gegevens gevonden"); return; }
  let d;
  try{ d = migrateData(plain(obj)); }catch(e){ toast("Deze gegevens kon ik niet lezen"); return; }
  d.seasons = d.seasons.filter(se=> se && se.id);
  if(!d.seasons.length){ toast("Geen teams of seizoenen gevonden in deze gegevens"); return; }
  IMP = d;
  const clash = d.seasons.some(se=> S.seasons.some(x=> x.id === se.id));
  const club0 = (d.seasons.find(x=> (x.club||"").trim()) || {}).club || "";
  let h = '<p class="muted">Kijk de namen na. In de nieuwe app bestaat een team uit een club, een teamnaam en een seizoen.</p>';
  h += '<div class="card"><div class="row"><label class="lbl" for="iClub">Club</label><input type="text" id="iClub" value="'+esc(club0)+'" placeholder="bv. KHC Dragons" autocomplete="off"></div></div>';
  h += '<p class="muted">Staat de clubnaam ook vooraan in een teamnaam, dan haalt de app die daar weg.</p>';
  d.seasons.forEach((se,i)=>{
    const nm = (se.matches||[]).length;
    h += '<div class="sec">'+esc(se.team || "Team")+' · '+nm+' wedstrijd'+(nm===1?"":"en")+'</div><div class="card">'+
      '<div class="row"><label class="lbl" for="iT'+i+'">Team</label><input type="text" id="iT'+i+'" value="'+esc(se.team||"")+'" autocomplete="off"></div>'+
      '<div class="row"><label class="lbl" for="iS'+i+'">Seizoen</label><input type="text" id="iS'+i+'" value="'+esc(se.name||seasonLabel(seasonStartYear()))+'" autocomplete="off"></div></div>';
  });
  if(clash) h += '<p class="muted" style="margin-top:14px"><b>Let op:</b> minstens één team staat al in de app. Dat team wordt vervangen door de versie uit deze gegevens, ook de wedstrijden.</p>';
  h += '<div class="pad"><button class="btn" id="iGo">'+d.seasons.length+' team'+(d.seasons.length===1?"":"s")+' overnemen</button></div>';
  openModal("Gegevens overnemen", h, { onMount(mo){ mo.querySelector("#iGo").onclick = ()=> doImport(mo); } });
}
function stripClub(team, club){
  const t = String(team||"").trim(), c = String(club||"").trim();
  if(c && t.toLowerCase().indexOf(c.toLowerCase()) === 0){
    const rest = t.slice(c.length).replace(/^[\s\-–—:·,]+/, "").trim();
    if(rest) return rest;
  }
  return t;
}
function doImport(mo){
  const d = IMP; if(!d) return;
  const club = mo.querySelector("#iClub").value.trim();
  let first = null;
  d.seasons.forEach((se,i)=>{
    const team = stripClub(mo.querySelector("#iT"+i).value, club) || "Team";
    const nm = mo.querySelector("#iS"+i).value.trim() || seasonLabel(seasonStartYear());
    const cname = club || se.club || "";
    let clubId = "";
    if(cname){
      const hit = Object.values(CLUBS).find(x=> x.norm === normClub(cname));
      clubId = hit ? hit.id : createClub(cname);
    }
    const t = { id:se.id, clubId, club:cname, team, name:nm, created:se.created || Date.now(),
      roster:se.roster || {}, matches:(se.matches||[]).filter(m=> m && m.id),
      members:[USER.uid], admins:[USER.uid], people:{ [USER.uid]:{ f:PROFILE.first||"", l:PROFILE.last||"" } },
      invites:[], createdBy:USER.uid };
    S.seasons = S.seasons.filter(x=> x.id !== t.id);
    S.seasons.push(t);
    if(!first) first = t;
  });
  S.seasons.sort((a,b)=> (b.created||0) - (a.created||0));
  IMP = null; SYNC.full = true;
  S.activeSeason = first.id; S.openMatch = null;
  save(true); closeModal(); go("season");
  toast(d.seasons.length + " team" + (d.seasons.length===1?"":"s") + " overgenomen");
}

/* offline draaien, en zelf nagaan of er een nieuwe versie klaarstaat */
let swReg = null, updateReady = false, reloading = false, checking = false;

function showUpdateBar(){
  if(document.getElementById("updbar")) return;
  const bar = document.createElement("div");
  bar.className = "updbar"; bar.id = "updbar";
  bar.innerHTML = '<span>Nieuwe versie klaar</span>' +
    '<button id="updGo">Vernieuwen</button>' +
    '<button class="x" id="updX" aria-label="Later">Later</button>';
  const app = document.getElementById("app");
  app.insertBefore(bar, app.children[1]);
  document.getElementById("updGo").onclick = applyUpdate;
  document.getElementById("updX").onclick = ()=> bar.remove();
}
function applyUpdate(){
  save(true);
  if(swReg && swReg.waiting){
    swReg.waiting.postMessage({ type:"SKIP_WAITING" });
    setTimeout(()=>{ if(!reloading){ reloading = true; location.reload(); } }, 1200);
  }else{
    reloading = true; location.reload();
  }
}
function watchWorker(w){
  if(!w) return;
  w.addEventListener("statechange", ()=>{
    if(w.state === "installed" && navigator.serviceWorker.controller){
      updateReady = true; showUpdateBar();
    }
  });
}
async function checkForUpdate(manual){
  if(!swReg){ if(manual) toast("Updates werken pas als de app vanaf de website draait"); return; }
  if(checking) return;
  checking = true;
  try{
    await swReg.update();
    setTimeout(()=>{
      checking = false;
      if(manual && !updateReady && !swReg.waiting) toast("Je gebruikt de nieuwste versie");
      if(swReg.waiting){ updateReady = true; showUpdateBar(); }
    }, 1400);
  }catch(e){
    checking = false;
    if(manual) toast("Kon niet controleren — geen verbinding?");
  }
}
if("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai$/.test(location.hostname)){
  window.addEventListener("load", async ()=>{
    try{
      swReg = await navigator.serviceWorker.register("sw.js");
      if(swReg.waiting && navigator.serviceWorker.controller){ updateReady = true; showUpdateBar(); }
      watchWorker(swReg.installing);
      swReg.addEventListener("updatefound", ()=> watchWorker(swReg.installing));
      navigator.serviceWorker.addEventListener("controllerchange", ()=>{
        if(!reloading){ reloading = true; location.reload(); }
      });
      checkForUpdate(false);
    }catch(e){ swReg = null; }
  });
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkForUpdate(false); });
  window.addEventListener("focus", ()=> checkForUpdate(false));
}

/* ---------- aanmelden, laden en profiel ---------- */
let bootT = null, loginBusy = false, loginHintT = null, loginErr = "", showAlt = false;

function gateHead(){ return '<img src="apple-touch-icon-v5.png" alt="">'; }
function renderBoot(){
  nav('<div style="width:44px"></div>' + navTitle(APP_NAME) + '<div style="width:44px"></div>');
  let h = '<div class="gate">' + gateHead() + '<h1>' + APP_NAME + '</h1>';
  if(BOOT_ERR){
    h += '<p class="err">' + esc(BOOT_ERR) + '</p>' +
         '<button class="btn" onclick="location.reload()">Opnieuw proberen</button>' +
         (USER ? '<button class="link" onclick="doSignOut(true)">Afmelden</button>' : '');
  }else{
    h += '<p id="bootmsg">Gegevens laden…</p><div class="spin"></div>';
  }
  h += '</div>';
  $("#view").innerHTML = h;
  clearTimeout(bootT);
  if(!BOOT_ERR) bootT = setTimeout(()=>{
    const el = document.getElementById("bootmsg");
    if(el && VIEW === "boot") el.textContent = navigator.onLine
      ? "Dit duurt langer dan normaal. Even geduld, of controleer je verbinding."
      : "Geen internet. De eerste keer op dit toestel is verbinding nodig.";
  }, 9000);
}
function bootError(e){
  console.warn(e);
  const code = e && e.code || "";
  BOOT_ERR = code === "permission-denied"
    ? "De databank weigert de toegang. Staan de regels uit firestore.rules in Firebase?"
    : "De gegevens konden niet geladen worden (" + (code || "onbekende fout") + ").";
  if(!READY){ VIEW = "boot"; render(); } else toast(BOOT_ERR, 5000);
}
function renderLogin(){
  nav('<div style="width:44px"></div>' + navTitle(APP_NAME) + '<div style="width:44px"></div>');
  let h = '<div class="gate">' + gateHead() + '<h1>' + APP_NAME + '</h1>' +
    '<p>Speeltijd en banktijd bijhouden tijdens een hockeywedstrijd.</p>' +
    (pendingCode() ? '<p><b>Je bent uitgenodigd voor een team.</b> Meld je aan, daarna tik je op Lid worden.</p>'
                   : '<p>Meld je aan, dan staan je teams en wedstrijden op elk toestel waar je aanmeldt.</p>');
  if(!window.FB){
    h += '<div class="spin"></div>';
  }else{
    h += '<button class="btn" id="gBtn" onclick="doLogin()" ' + (loginBusy ? "disabled" : "") + '>' +
         (loginBusy ? "Bezig met aanmelden…" : "Aanmelden met Google") + '</button>';
    if(loginErr) h += '<p class="err">' + esc(loginErr) + '</p>';
    if(showAlt) h += '<button class="link" onclick="doLogin(\'redirect\')">Blijft het hangen? Probeer de andere manier</button>';
  }
  h += '</div>';
  $("#view").innerHTML = h;
}
function loginMessage(e){
  const c = e && e.code || "";
  if(c === "auth/unauthorized-domain") return "Dit webadres is niet toegelaten in Firebase (Authentication → Settings → Authorized domains).";
  if(c === "auth/network-request-failed") return "Geen verbinding met Google. Controleer je internet en probeer opnieuw.";
  if(c === "auth/operation-not-allowed") return "Aanmelden met Google staat nog niet aan in Firebase (Authentication → Sign-in method).";
  if(c === "auth/account-exists-with-different-credential") return "Dit e-mailadres is al gekoppeld aan een andere manier van aanmelden.";
  return "Aanmelden mislukt (" + (c || "onbekende fout") + ").";
}
async function doLogin(mode){
  if(!window.FB || loginBusy) return;
  loginBusy = true; loginErr = "";
  renderLogin();
  clearTimeout(loginHintT);
  loginHintT = setTimeout(()=>{ if(loginBusy){ showAlt = true; loginBusy = false; if(VIEW === "login") renderLogin(); } }, 15000);
  try{
    await window.FB.signInGoogle(mode === "redirect" ? "redirect" : "popup");
  }catch(e){
    const c = e && e.code || "";
    if(mode !== "redirect" && (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment")){
      loginBusy = false; clearTimeout(loginHintT); return doLogin("redirect");
    }
    if(c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request" || c === "auth/user-cancelled"){ toast("Aanmelden geannuleerd"); }
    else { loginErr = loginMessage(e); showAlt = true; }
  }
  loginBusy = false; clearTimeout(loginHintT);
  if(VIEW === "login") renderLogin();
}
window.fbAuthError = e=>{
  const c = e && e.code || "";
  if(c === "auth/popup-closed-by-user" || c === "auth/user-cancelled") return;
  loginErr = loginMessage(e); showAlt = true;
  if(VIEW === "login") renderLogin();
};
window.fbAuthChanged = u=>{
  if(!u){
    stopSync(); USER = null; READY = false; PROFILE = undefined; BOOT_ERR = "";
    VIEW = "login"; closeModal(true); render(); return;
  }
  if(USER && USER.uid === u.uid) return;
  stopSync(); USER = u; READY = false; PROFILE = undefined; BOOT_ERR = "";
  VIEW = "boot"; closeModal(true); render();
  startSync();
};
window.fbReady = ()=>{ if(VIEW === "login") renderLogin(); };

function doSignOut(force){
  if(!force && SYNC.pending && !navigator.onLine){
    openModal("Afmelden",
      '<p class="muted">Er staan nog wijzigingen op dit toestel die niet in de cloud zitten, omdat er geen internet is. Meld je nu af, dan ben je die kwijt.</p>'+
      '<div class="pad"><button class="btn" onclick="closeModal()">Wachten op internet</button></div>'+
      '<div class="pad" style="padding-top:0"><button class="btn ghost" style="color:var(--danger)" onclick="doSignOut(true)">Toch afmelden</button></div>');
    return;
  }
  closeModal(true);
  try{ flush(); }catch(e){}
  if(window.FB) window.FB.signOut().catch(e=> toast("Afmelden mislukt"));
}

}

  h += '<div class="pad"><button class="btn" id="pGo">'+(first ? "Verder" : "Bewaren")+'</button></div>';
  h += '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="doSignOut()">Afmelden</button></div>';
  $("#view").innerHTML = h;
  const f = $("#pF"), l = $("#pL");
  const fire = ()=>{
    const fv = f.value.trim(), lv = l.value.trim();
    if(!fv){ f.focus(); toast("Geef je voornaam"); return; }
    const wasReady = READY;
    PROFILE = { first:fv, last:lv, email:(USER && USER.email) || "" };
    const F = window.FB;
    F.setDoc(F.doc(F.db, "users", USER.uid), Object.assign({}, PROFILE, { updatedAt:F.serverTimestamp() }), { merge:true })
      .catch(e=> syncError(e));
    if(!wasReady){ if(!READY){ VIEW = "boot"; render(); maybeRoute(); } }
    else {
      S.seasons.forEach(se=>{ se.people = Object.assign({}, se.people); se.people[USER.uid] = { f:fv, l:lv }; });
      save(true);
      toast("Profiel bewaard"); go(season() ? "season" : "home");
    }
  };
  $("#pGo").onclick = fire;
  [f,l].forEach(el=> el.addEventListener("keydown", e=>{ if(e.key === "Enter") fire(); }));
}

(function(){

      const c = parseCode(raw);

function pendingCode(){
  try{ const p = JSON.parse(localStorage.getItem("hbm.pendingCode") || "null"); if(p && Date.now() - p.at < 3 * DAY_MS) return p.code; }catch(e){}
  return null;
}

function handlePendingCode(){
  const c = pendingCode(); if(!c || !READY) return;
  clearPendingCode();
  setTimeout(()=> checkCode(c), 300);
}
